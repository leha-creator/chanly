# Automatically loaded as compose.override.yml by release.sh on the dev server.
services:
  postgres:
    mem_limit: 384m
    cpus: 0.5
  backup:
    mem_limit: 192m
    cpus: 0.25
  api-a:
    volumes: [./certs:/etc/maxim/dev-certs:ro, ./fake-state:/var/lib/maxim/fake-state]
    mem_limit: 192m
    cpus: 0.5
  api-b:
    volumes: [./certs:/etc/maxim/dev-certs:ro, ./fake-state:/var/lib/maxim/fake-state]
    mem_limit: 192m
    cpus: 0.5
  worker-a:
    volumes: [./certs:/etc/maxim/dev-certs:ro, ./fake-state:/var/lib/maxim/fake-state]
    mem_limit: 256m
    cpus: 0.5
  worker-b:
    volumes: [./certs:/etc/maxim/dev-certs:ro, ./fake-state:/var/lib/maxim/fake-state]
    mem_limit: 256m
    cpus: 0.5
  migrate:
    volumes: [./certs:/etc/maxim/dev-certs:ro, ./fake-state:/var/lib/maxim/fake-state]
    mem_limit: 192m
    cpus: 0.5
  mailpit:
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes: [mailpit-data:/data]
    mem_limit: 64m
    cpus: 0.25
    ports: !override ['127.0.0.1:8026:8025']
    networks:
      backend: {}
      edge:
        aliases: [maxim-dev-mailpit]

volumes:
  mailpit-data: {}
