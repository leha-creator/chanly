name: maxim-production-storage
services:
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: [server, /data, --console-address, ':9001']
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
      MINIO_REGION_NAME: us-east-1
    ports: ['127.0.0.1:9001:9001']
    volumes: [minio-data:/data]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    healthcheck:
      test: [CMD, curl, -fsS, 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      edge:
        aliases: [maxim-production-storage]
  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    profiles: [tools]
    restart: 'no'
    env_file: ./storage.env
    entrypoint: [/bin/sh, /init.sh]
    volumes: ['./storage-init.sh:/init.sh:ro']
    tmpfs: [/tmp]
    environment:
      MC_CONFIG_DIR: /tmp/mc
    networks: [edge]
networks:
  edge:
    external: true
    name: edge
volumes:
  minio-data: {}
