name: maxim-edge
services:
  caddy:
    image: caddy:2.11.7
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites:/etc/caddy/sites:ro
      - ./auth:/etc/caddy/auth:ro
      - /opt/maxim-dev/frontend:/srv/maxim-dev:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    networks: [edge]
networks:
  edge:
    external: true
    name: edge
volumes:
  caddy-data: {}
  caddy-config: {}
