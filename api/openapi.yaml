        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  # ---------------------------------------------------------------- admin: ledger
  /admin/ledger/summary:
    get:
      tags: [admin-ledger]
      operationId: getLedgerSummary
      summary: Сверка журнала проводок (06 §2.4)
      description: |
        Роль: senior. Остатки по видам счетов, сверка с последней выпиской, обязательства перед
        рекламодателями против денег. Внешних вызовов нет.
      responses:
        '200':
          description: Сверка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LedgerSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/ledger/entries:
    get:
      tags: [admin-ledger]
      operationId: listLedgerEntries
      summary: Журнал денег (проводки)
      description: |
        Роль: senior. Новые первыми. Один элемент — одна проводка: у операции из нескольких проводок
        (расчёт по размещению, выплата с комиссией) элементы идут подряд с одним `id`. Фильтр
        `organization_id` отбирает проводки, где организация на стороне дебета или кредита.
      parameters:
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/LedgerTransactionKind' }
        - name: organization_id
          in: query
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Проводки
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/LedgerEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/ledger/manual:
    post:
      tags: [admin-ledger]
      operationId: createManualLedgerEntry
      summary: Корректирующая проводка (S-19 `manual_ledger_entry`)
      description: |
        Роль: senior. Основание обязательно. Сумма не больше порога `LEDGER_MANUAL_SECOND_APPROVAL_THRESHOLD`
        (100 000 ₽) — проводка сразу (`201`); больше — `202` с запросом подтверждения: проводка
        создаётся, когда другой `senior` подтвердит запрос. Повтор с тем же `Idempotency-Key`
        возвращает ту же проводку или тот же запрос.

        Отказы `409` с `details.reason`: `insufficient_balance` (недостающая сумма в копейках —
        в `details.missing`); `idempotency_conflict` — тот же ключ с другой проводкой или другим
        запросом; `second_approval` — нужно второе подтверждение. Отказы `422`: пустой ключ —
        `details.field = Idempotency-Key`, `details.reason = invalid`; неверная пара счетов (дебет
        равен кредиту, `organization_id`/`placement_id` не подходят виду счёта) — `details.field = debit`,
        `details.reason = invalid_account`; пустое основание — `details.field = reason`,
        `details.reason = required`.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManualLedgerInput' }
            example:
              debit: { kind: bank }
              credit: { kind: platform_revenue }
              amount: 150000
              reason: Комиссия банка за октябрь
      responses:
        '201':
          description: Проводка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LedgerOperationResult' }
        '202': { $ref: '#/components/responses/ApprovalRequired' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/ledger/deposit-topups:
    post:
      tags: [admin-ledger]
      operationId: createDepositTopup
      summary: Пополнение депозита Рокет Ворк с расчётного счёта
      description: |
        Роль: senior. Проводка `deposit_topup` (bank → rocketwork_deposit); порог второго подтверждения,
        повтор по `Idempotency-Key` и отказы `409`/`422` — как у ручной проводки.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AmountReasonInput' }
            example: { amount: 5000000, reason: Пополнение по платёжке 77 }
      responses:
        '201':
          description: Проводка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LedgerOperationResult' }
        '202': { $ref: '#/components/responses/ApprovalRequired' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/organizations/{id}/balance-returns:
    post:
      tags: [admin-ledger]
      operationId: createBalanceReturn
      summary: Возврат свободного остатка рекламодателю (S-33)
      description: |
        Роль: senior. Не больше свободного остатка баланса (иначе `409` с `details.reason = insufficient_balance`
        и недостающей суммой в `details.missing`); тот же `Idempotency-Key` с другой суммой — `409`
        с `details.reason = idempotency_conflict`. Перевод на счёт рекламодателя делает человек
        по реквизитам организации.
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AmountReasonInput' }
            example: { amount: 120000, reason: Заявление на возврат от 20.10.2026 }
      responses:
        '201':
          description: Проводка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LedgerOperationResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  # ---------------------------------------------------------------- admin: approvals
  /admin/approvals:
    get:
      tags: [admin-approvals]
      operationId: listAdminApprovals
      summary: Запросы второго подтверждения
      description: |
        Роль: senior. По умолчанию — все запросы: `pending` старые первыми, за ними остальные новые
        первыми. Просроченный запрос переводится в `expired` при чтении.
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AdminApprovalStatus' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Запросы
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/AdminApproval' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/approvals/{id}/approve:
    post:
      tags: [admin-approvals]
      operationId: approveAdminApproval
      summary: Подтвердить операцию вторым администратором
      description: |
        Роль: senior, не автор запроса (`409` с `details.reason = same_admin`). Операция исполняется
        сразу; уже решённый запрос — `409 approval_decided`, просроченный — `409 approval_expired`.
        Если исполнение отказало, запрос остаётся `pending`, а ответ — отказ операции: `409` с
        `details.reason` `insufficient_balance`, `idempotency_conflict` или `invalid_state`; `404` —
        выплата не найдена.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Запрос с результатом
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminApproval' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/approvals/{id}/reject:
    post:
      tags: [admin-approvals]
      operationId: rejectAdminApproval
      summary: Отклонить запрос подтверждения
      description: 'Роль: senior. Автор может отозвать свой запрос этой же операцией.'
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminReasonInput' }
            example: { reason: Сумма не совпадает с актом сверки }
      responses:
        '200':
          description: Запрос
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminApproval' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  # ---------------------------------------------------------------- admin: organizations and users
  /admin/organizations:
    get:
      tags: [admin-organizations]
      operationId: listAdminOrganizations
      summary: Организации
      description: |
        Роль: moderator, senior. Новые первыми. Поиск по ИНН, части наименования (без учёта регистра)
        или почте участника целиком. ИНН полный у `senior`, маскированный у `moderator`. `senior` ищет
        по началу ИНН, `moderator` — только по ИНН целиком (иначе подбором по началу восстанавливается
        скрытая часть, R-14). Организации платформы в списке нет, её карточка — `404`.
      parameters:
        - name: query
          in: query
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: role
          in: query
          description: Открытый кабинет организации
          schema: { $ref: '#/components/schemas/Cabinet' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Организации
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/AdminOrganizationListItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/organizations/{id}:
    get:
      tags: [admin-organizations]
      operationId: getAdminOrganization
      summary: 'Организация: реквизиты, участники, контрагент ОРД'
      description: 'Роль: moderator, senior. ИНН полный у `senior`.'
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 'Организация'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOrganization' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [admin-organizations]
      operationId: updateAdminOrganization
      summary: Исправить реквизиты организации (S-20)
      description: |
        Роль: senior. Наименование и КПП; ИНН и тип лица не меняются. Изменение наименования или
        КПП отправляет контрагента в ОРД заново. Ошибки полей — `422` с `details.field`.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminOrganizationUpdate' }
            example: { name: ООО «Ромашка», reason: Наименование по выписке ЕГРЮЛ }
      responses:
        '200':
          description: 'Организация'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOrganization' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/users/{id}/block:
    post:
      tags: [admin-organizations]
      operationId: blockUser
      summary: Заблокировать пользователя
      description: |
        Роль: senior. Все сессии пользователя завершаются, вход невозможен. Администратора
        заблокировать нельзя (`409` с `details.reason = admin_user`): сначала снимите роль.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminReasonInput' }
            example: { reason: Мошеннические оплаты }
      responses:
        '200':
          description: Пользователь
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/users/{id}/unblock:
    post:
      tags: [admin-organizations]
      operationId: unblockUser
      summary: Разблокировать пользователя
      description: |
        Роль: senior. Обезличенного пользователя (R-26) не разблокировать: `409`, `details.reason = anonymized`.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminReasonInput' }
            example: { reason: Проверка завершена }
      responses:
        '200':
          description: Пользователь
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  # ---------------------------------------------------------------- admin: audit log
  /admin/audit-log:
    get:
      tags: [admin-audit]
      operationId: listAuditLog
      summary: Журнал действий
      description: |
        Роль: senior. Новые первыми. `data` — как записано (ИНН, почта, телефон и ФИО маскируются при записи);
        IP-адрес не отдаётся. `manual_only` — только действия администраторов, `actor_type` при этом
        не учитывается. `from` и `to` — дни по Москве, `to` включительно. Коды действий: `channel.approved`,
        `channel.rejected`, `channel.rkn_checked`, `channel.blocked`, `channel.unblocked`, `channel_category.created`,
        `channel_category.updated`, `post.version_approved`, `post.version_rejected`, `placement.admin_cancel`,
        `placement.admin_mark_removed`, `dispute.opened`, `dispute.resolved`, `dispute.remove_post`,
        `payout.retry`, `payout.mark_paid`, `payout.exported`, `ledger.manual`,
        `ledger.balance_return`, `ledger.deposit_topup`, `admin_approval.requested`, `admin_approval.approved`,
        `admin_approval.rejected`, `bank_statement.imported`, `bank_transaction.matched`, `bank_transaction.ignored`,
        `invoice.cancelled`, `organization.admin_updated`, `user.blocked`, `user.unblocked`,
        `user.admin_role_changed`, `ord.retry`, `ord_report.built`, `ord_report.send_requested`,
        `personal_data.exported`, `user.anonymized` (команды `maxim admin pd`) и действия кабинетов. Переписка спора — в самом споре, отдельной записи журнала у сообщения нет.
      parameters:
        - name: actor_user_id
          in: query
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: actor_type
          in: query
          schema: { type: string, enum: [advertiser, blogger, admin, system] }
        - name: action
          in: query
          schema: { type: string, maxLength: 64 }
        - name: object_type
          in: query
          schema: { type: string, maxLength: 64 }
        - name: object_id
          in: query
          schema: { type: string, maxLength: 64 }
        - name: organization_id
          in: query
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: manual_only
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Записи
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/AuditLogEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  # ---------------------------------------------------------------- admin: ORD (S-20, S-31)
  /admin/ord/errors:
    get:
      tags: [admin-ord]
      operationId: listOrdErrors
      summary: 'Объекты ОРД в ошибке (S-20 шаг 1)'
      description: |
        Роль: moderator, senior. Давно изменённые первыми. Без `limit` страница — 50 записей,
        а не 20, как у других списков.
      parameters:
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/OrdObjectType' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 'Объекты'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/OrdObject' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/ord/objects/{type}/{id}:
    get:
      tags: [admin-ord]
      operationId: getOrdObject
      summary: 'Объект ОРД: состояние, последний запрос и ответ'
      description: |
        Роль: moderator, senior. Запрос — как сохранён (ИНН маскирован, вместо текста креатива — длина).
      parameters:
        - name: type
          in: path
          required: true
          schema: { $ref: '#/components/schemas/OrdObjectType' }
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 'Объект'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrdObject' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/ord/objects/{type}/{id}/retry:
    post:
      tags: [admin-ord]
      operationId: retryOrdObject
      summary: Повторить отправку в ОРД (S-20 шаг 2)
      description: |
        Роль: moderator, senior. Только объект в `error`; иначе — `409` с `details.sync_status`. Креатив с erid заново не
        отправляется: возобновляется опрос статуса.
      parameters:
        - name: type
          in: path
          required: true
          schema: { $ref: '#/components/schemas/OrdObjectType' }
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminReasonInput' }
            example: { reason: Наименование исправлено }
      responses:
        '200':
          description: 'Объект'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrdObject' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/ord/reports:
    get:
      tags: [admin-ord]
      operationId: listOrdReports
      summary: Ежемесячная отчётность ОРД (S-31)
      description: 'Роль: moderator, senior. Месяцы, по которым отчёт формировался, новые первыми.'
      responses:
        '200':
          description: Отчёты
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/OrdReportSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/ord/reports/{period}:
    get:
      tags: [admin-ord]
      operationId: getOrdReport
      summary: Отчёт ОРД за месяц
      description: |
        Роль: moderator, senior. Статистика по парам «креатив + площадка» и акты по договорам.
        Отчёт не формировался — `state = not_built` и пустые списки.
      parameters:
        - $ref: '#/components/parameters/Period'
      responses:
        '200':
          description: Отчёт
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrdReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/ord/reports/{period}/rebuild:
    post:
      tags: [admin-ord]
      operationId: rebuildOrdReport
      summary: Сформировать отчёт заново
      description: |
        Роль: senior. Пересчитывает статистику и акты месяца по данным размещений; ничего не отправляет.
        Если отправка уже началась или её результат требует сверки, возвращает 409.
        Только прошедший месяц
        (текущий и будущий — `422` с `details.reason = period_not_closed`).
      parameters:
        - $ref: '#/components/parameters/Period'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminReasonInput' }
            example: { reason: Спор решён после формирования отчёта }
      responses:
        '200':
          description: Отчёт
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrdReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/ord/reports/{period}/send:
    post:
      tags: [admin-ord]
      operationId: sendOrdReport
      summary: Отправить отчёт в ОРД
      description: |
        Роль: senior. Ставит в очередь отправки все записи месяца, ждущие отправки или в ошибке.
        Отчёт не сформирован — `409` с `details.reason = report_not_built`. Текущий или будущий
        месяц — `422` с `details.field = period`, `details.reason = period_not_closed`.
      parameters:
        - $ref: '#/components/parameters/Period'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminReasonInput' }
            example: { reason: Отправка после исправления ошибок }
      responses:
        '200':
          description: Отчёт
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrdReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  # ---------------------------------------------------------------- admin: counters
  /admin/counters:
    get:
      tags: [admin]
      operationId: getAdminCounters
      summary: Счётчики для меню администратора
      description: 'Роль: moderator, senior.'
      responses:
        '200':
          description: Счётчики
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCounters' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- webhooks
  /webhooks/max/{secret}:
    post:
      tags: [webhooks]
      operationId: maxWebhook
      summary: События MAX Bot API
      description: |
        Подлинность — секретная часть пути и секретный токен подписки в заголовке
        `X-Max-Bot-Api-Secret` (Q-35; без `MAX_WEBHOOK_SECRET`, только вне продакшена, заголовок
        не проверяется). Тело до 1 МБ. Событие сохраняется и разбирается заданием; ответ не зависит
        от результата разбора: тело без `update_type` тоже получает `200` и отбрасывается.
      security: []
      parameters:
        - name: secret
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookPayload' }
            example: { update_type: bot_added, timestamp: 1760000000000, chat_id: -70000000001 }
      responses:
        '200': { description: Событие принято }
        '400': { description: Тело не прочитано }
        '401': { description: Проверка подлинности не пройдена }
        '413': { description: Тело больше 1 МБ }
        '500': { description: Событие не сохранено; MAX повторит доставку }
  /webhooks/rocketwork:
    post:
      tags: [webhooks]
      operationId: rocketworkWebhook
      summary: События Рокет Ворк
      description: |
        Public API v1: Authorization Bearer с секретом подписки. Нет корректного секрета — `401`.
        Событие запускает чтение актуального состояния; денежный статус из тела не применяется.
        Неизвестные события сохраняются и получают `200`. HMAC используется только локальным fake.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookPayload' }
            example: { id: 19, event: task.paid, data: { id: 7 }, happened_at: "2026-11-09T09:00:00Z" }
      responses:
        '200': { description: Событие принято }
        '400': { description: Тело не прочитано }
        '401': { description: Подпись не прошла проверку }
        '404': { description: Рокет Ворк не подключён (`ROCKETWORK_MODE=disabled`) }
        '413': { description: Тело больше 1 МБ }
        '500': { description: Событие не сохранено; Рокет Ворк повторит доставку }

  # ---------------------------------------------------------------- _mock
  /_mock/reset:
    post:
      tags: [_mock]
      operationId: mockReset
      summary: Вернуть начальные данные
      description: Сбрасывает все изменения и сдвиг часов. Сессии сохраняются.
      security: []
      responses:
        '204': { description: Сброшено }
  /_mock/clock:
    get:
      tags: [_mock]
      operationId: mockGetClock
      summary: Текущее время сервера
      security: []
      responses:
        '200':
          description: Время
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MockClock' }
    post:
      tags: [_mock]
      operationId: mockShiftClock
      summary: Сдвинуть часы вперёд
      description: |
        Сдвигает подменяемые часы; после сдвига срабатывают просроченные таймеры:
        T-01 (P-05), T-13 (P-18), T-05 (P-13).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MockClockShift' }
            example: { hours: 25 }
      responses:
        '200':
          description: Время после сдвига и выполненные переходы
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MockClock' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /_mock/orders/{id}/approve-post:
    post:
      tags: [_mock]
      operationId: mockApproveOrderPost
      summary: Одобрить пост и получить erid
      description: |
        Заменяет модерацию администратора (S-17) и регистрацию креатива в ОРД: текущая версия поста
        проходит `pending_moderation → approved → ready` с выдуманным erid, затем размещения
        из `created` переходят в `awaiting_blogger` (P-02).
      security: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Заказ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /_mock/orders/{id}/reject-post:
    post:
      tags: [_mock]
      operationId: mockRejectOrderPost
      summary: Отклонить пост
      description: Заменяет отклонение администратором (S-17). Размещения остаются в `created`.
      security: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MockRejectInput' }
            example: { reason: Нет пометки о рекламе на изображении }
      responses:
        '200':
          description: Заказ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /_mock/placements/{id}/advance:
    post:
      tags: [_mock]
      operationId: mockAdvancePlacement
      summary: Выполнить системный переход
      description: |
        Заменяет планировщик и внешние системы:
        `P-08` — публикация (`scheduled → published`, часы сдвигаются на `publish_at`, если он в будущем);
        `P-10` — снятие (`published → removed`, часы сдвигаются на `remove_at`);
        `P-16` — выплата прошла (`accepted → paid`).
      security: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MockAdvanceInput' }
            example: { transition: P-08 }
      responses:
        '200':
          description: Размещение
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdvertiserPlacement' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /_mock/invoices/{id}/pay:
    post:
      tags: [_mock]
      operationId: mockPayInvoice
      summary: Оплатить счёт
      description: Заменяет зачисление по выписке (S-30). Сумма счёта поступает на баланс.
      security: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Счёт
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /_mock/channels/link:
    post:
      tags: [_mock]
      operationId: mockLinkChannel
      summary: Подключить канал по коду
      description: |
        Заменяет сообщение с кодом подключения в канале (S-12): создаёт выдуманный канал MAX,
        привязывает его к организации кода и отправляет на модерацию; модерацию тестовый сервер
        проходит сразу — канал становится `active`, когда у него есть категория и цена.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MockLinkChannelInput' }
            example: { code: K7M2Q9XA, title: Мой тестовый канал, subscribers_count: 4200 }
      responses:
        '201':
          description: Канал
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BloggerChannel' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: session

  headers:
    X-Request-Id:
      description: Сквозной идентификатор запроса
      schema: { type: string }

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    Limit:
      name: limit
      in: query
      description: Размер страницы
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      description: Значение `next_cursor` из предыдущего ответа
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Ключ идемпотентности действия (03 §11). Повтор с тем же ключом возвращает текущее состояние
        объекта без нового перехода. Без ключа повтор действия отклоняется `409 invalid_transition`
        с фактическим состоянием.
      schema: { type: string, minLength: 1, maxLength: 64 }
    Period:
      name: period
      in: path
      required: true
      description: Месяц по Москве
      schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$', example: '2026-09' }

  responses:
    ApprovalRequired:
      description: |
        Сумма больше порога второго подтверждения: операция не исполнена, создан запрос (R-2).
        Её исполнит подтверждение другого `senior` (`POST /admin/approvals/{id}/approve`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AdminApproval' }
    ValidationFailed:
      description: |
        Запрос не прошёл проверку. В `details` всегда есть `field` и `reason`. Запрос сначала
        проверяется по этой спецификации: тогда `field` — путь к полю, `reason` — ключевое слово
        схемы (`required`, `pattern`, `minLength`, `maximum`, `enum`…), а для неразобранного тела или
        параметра — `malformed` или `invalid`. Проверки предметной области дают свои причины
        (`required`, `invalid_format`, `not_allowed`, …), они названы в описаниях операций.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: validation_failed, message: request body is invalid, details: { field: email, reason: pattern } }
            request_id: 0190a000-0000-7000-8000-00000000aaaa
    Unauthorized:
      description: Нет сессии или неверный код
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: |
        Доступ запрещён, причина в `details.reason`: `cabinet_required` — нет нужного кабинета
        (какого — в `details.cabinet`); `organization_required` — не заполнены реквизиты; `csrf` —
        нет или не совпал `X-CSRF-Token`; `user_blocked` — пользователь заблокирован (при входе);
        `admin_required` — у операции администратора нет нужной роли. Запрос к `/admin*` не из
        разрешённой сети отклоняет edge (`403 forbidden` без `details`) до `api`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Объекта нет или он чужой
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: |
        Действие невозможно в текущем состоянии данных; уточнение — в `details.reason`
        (перечислено в описании операции) или в `details.status` с текущим состоянием объекта
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidTransition:
      description: Переход недопустим из текущего состояния размещения
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: invalid_transition
              message: transition is not allowed from current status
              details: { transition: P-12, status: published }
            request_id: 0190a000-0000-7000-8000-00000000aaaa
    RateLimited:
      description: Превышен лимит частоты
      headers:
        Retry-After:
          description: Через сколько секунд можно повторить
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: rate_limited, message: too many requests, details: { scope: email } }
            request_id: 0190a000-0000-7000-8000-00000000aaaa
    ServiceUnavailable:
      description: Внешний сервис не подключён или недоступен
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: service_unavailable, message: service is unavailable, details: { reason: rocketwork_unavailable } }
            request_id: 0190a000-0000-7000-8000-00000000aaaa
    NotImplemented:
      description: Операция описана, но бэкенд её ещё не реализует
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: not_implemented, message: operation is not implemented yet, details: { operation: getCart } }
            request_id: 0190a000-0000-7000-8000-00000000aaaa

  schemas:
    RealtimeControl:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, enum: [1] }
    RealtimeInvalidation:
      type: object
      additionalProperties: false
      required: [version, topic]
      description: |
        Только имена областей и UUID, не бизнес-данные. post.changed содержит campaign_id;
        placement.changed — order_id/campaign_id, если доступны. Catalog broadcast не содержит UUID.
        Несколько затронутых областей дают отдельные события. Уведомления не заменяют changefeed.
      properties:
        version: { type: integer, enum: [1] }
        topic:
          type: string
          maxLength: 64
          pattern: '^[a-z][a-z_.]{0,63}$'
          enum: [session.changed, notification.changed, balance.changed, invoice.changed, closing_act.changed,
            order.changed, placement.changed, campaign.changed, post.changed, channel.changed, channel.metrics.changed,
            cart.changed, media.changed, payout.changed, rocketwork.changed, organization.changed, category.changed, format.changed,
            admin.channel.changed, admin.order.changed, admin.placement.changed, admin.dispute.changed, admin.finance.changed,
            admin.ord.changed, admin.organization.changed, admin.audit.changed, admin.counters.changed]
        object_id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        campaign_id: { type: string, format: uuid }
        channel_id: { type: string, format: uuid }
    RocketworkCheck:
      type: object
      additionalProperties: false
      required: [available, state, amount_kopecks, max_commission_kopecks, can_start]
      properties:
        available: { type: boolean }
        state: { type: string, enum: [not_configured, ready, working, reconcile_required, paid, stopped, discrepancy] }
        run_id: { type: string }
        recipient: { type: string, description: 'Маскированный ИНН утверждённого получателя' }
        amount_kopecks: { type: integer, format: int64 }
        max_commission_kopecks: { type: integer, format: int64 }
        actual_commission_kopecks: { type: integer, format: int64 }
        can_start: { type: boolean }
    # ------------------------------------------------ common
    Uuid:
      type: string
      format: uuid
      example: 0190a000-0000-7000-8000-000000000101
    Money:
      type: integer
      format: int64
      minimum: 0
      description: Сумма в копейках
      example: 345000
    SignedMoney:
      type: integer
      format: int64
      description: Сумма в копейках со знаком
      example: -345000
    TimeOfDay:
      type: string
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      description: Время суток по Москве
      example: '10:00'
    ErrorCode:
      type: string
      enum:
        - validation_failed
        - unauthorized
        - forbidden
        - not_found
        - conflict
        - invalid_transition
        - insufficient_balance
        - cart_changed
        - campaign_incomplete
        - inn_taken
        - rate_limited
        - service_unavailable
        - not_implemented
        - internal
    Error:
      type: object
      required: [error, request_id]
      properties:
        error: { $ref: '#/components/schemas/ErrorBody' }
        request_id: { type: string }
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string, description: Короткое описание на английском }
        details:
          type: object
          additionalProperties: true
    PageMeta:
      type: object
      properties:
        next_cursor:
          type: string
          description: Нет — это последняя страница
        total:
          type: integer
          minimum: 0
          description: |
            Сколько всего записей подходит под фильтры списка (все страницы). Нет — сервер это
            число для списка не считает; кабинет тогда не показывает «N из M».

    # ------------------------------------------------ enums (04 §9)
    LegalType:
      type: string
      enum: [legal_entity, sole_proprietor, self_employed]
    TaxRegime:
      type: string
      enum: [osno, usn, ausn, eshn, psn, npd]
    VatRate:
      type: string
      enum: [none, vat_5, vat_7, vat_22]
    Cabinet:
      type: string
      enum: [advertiser, blogger]
    ChannelStatus:
      type: string
      enum: [unclaimed, pending_rights, moderation, active, rejected, suspended, disconnected, blocked]
    RknStatus:
      type: string
      enum: [not_required, pending, confirmed, rejected]
    PlacementFormatId:
      type: string
      description: Идентификатор формата из справочника (03 §2)
      example: f_1_24
    CampaignStatus:
      type: string
      enum: [draft, ordered, archived]
    PostVersionStatus:
      type: string
      enum: [pending_moderation, rejected, approved, ready]
    OrderStatus:
      type: string
      enum: [moderation, rejected, marking, in_progress, completed, cancelled]
    PlacementStatus:
      type: string
      enum:
        - created
        - awaiting_blogger
        - awaiting_schedule
        - scheduled
        - published
        - removed
        - disputed
        - accepted
        - paid
        - declined
        - expired
        - cancelled
        - failed
        - refunded
    TokenCarrier:
      type: string
      enum: [text, media]
      description: Где пометка «Реклама» с названием и ИНН
    TokenPosition:
      type: string
      enum: [link, above, below]
      description: Где erid
    ClaimReason:
      type: string
      enum: [removed_early, top_violated, content_mismatch, other]
    InvoiceStatus:
      type: string
      enum: [issued, paid, expired, cancelled]
    PayoutStatus:
      type: string
      enum: [created, sent, succeeded, failed]
    PayoutMethod:
      type: string
      enum: [rocketwork, bank_transfer]
      description: '`bank_transfer` — юрлицу переводом вне Рокет Ворк (A-36)'
    PayoutFailureCode:
      type: string
      enum: [contractor_not_active, tax_status_lost, income_limit_exceeded, insufficient_deposit, provider_error]
      description: Причина `failed` (05 §4.3)
    RocketworkContractorStatus:
      type: string
      enum: [none, invited, pending, active, blocked]
      description: '`none` — онбординг не начат'
    AdvertiserPlacementAction:
      type: string
      enum: [cancel, accept, claim]
    BloggerPlacementAction:
      type: string
      enum: [accept, decline, schedule, reschedule]

    # ------------------------------------------------ auth
    LoginCodeRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    LoginCodeResponse:
      type: object
      required: [expires_in_seconds]
      properties:
        expires_in_seconds: { type: integer, example: 600 }
    LoginRequest:
      type: object
      required: [email, code]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        code: { type: string, pattern: '^[0-9]{6}$' }
    Me:
      type: object
      required: [user, organizations, pending_legal_document_ids]
      properties:
        user: { $ref: '#/components/schemas/User' }
        organizations:
          type: array
          description: В первой версии — не больше одной
          items: { $ref: '#/components/schemas/OrganizationBrief' }
        pending_legal_document_ids:
          type: array
          description: Документы, которые нужно принять для работы в открытых кабинетах
          items: { $ref: '#/components/schemas/Uuid' }
        admin_role:
          allOf: [{ $ref: '#/components/schemas/AdminRole' }]
          description: |
            Роль администратора (07 §4); нет — пользователь не администратор. Нужна кабинету,
            чтобы показывать разделы `adm/*`; права всё равно проверяет каждая операция (`403`).
    AdminRole:
      type: string
      enum: [moderator, senior]
    User:
      type: object
      required: [id, email]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        email: { type: string, format: email }
        last_login_at: { type: string, format: date-time }

    # ------------------------------------------------ organizations
    OrganizationBrief:
      type: object
      required: [id, name, inn, legal_type, cabinets]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        inn: { type: string }
        legal_type: { $ref: '#/components/schemas/LegalType' }
        cabinets:
          type: array
          items: { $ref: '#/components/schemas/Cabinet' }
    OrganizationFields:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 500, description: Наименование или ФИО }
        contact_name: { type: string, minLength: 1, maxLength: 200 }
        phone: { type: string, pattern: '^\+7[0-9]{10}$' }
        kpp:
          type: string
          pattern: '^[0-9]{9}$'
          description: Только у `legal_entity` с кабинетом блогера, там обязателен; иначе `422 not_allowed`
        address:
          type: string
          maxLength: 500
          description: Обязателен у `legal_entity` и `sole_proprietor`; у `self_employed` — `422 not_allowed`
        tax_regime:
          allOf: [{ $ref: '#/components/schemas/TaxRegime' }]
          description: У `self_employed` без значения — `npd`
        vat_rate:
          allOf: [{ $ref: '#/components/schemas/VatRate' }]
          description: У `self_employed` без значения — `none`
        signer_position:
          type: string
          maxLength: 200
          description: |
            Поля `signer_*` — только у `legal_entity` с кабинетом блогера, там все четыре обязательны;
            иначе `422 not_allowed`
        signer_name: { type: string, maxLength: 200 }
        signer_basis_name: { type: string, maxLength: 200 }
        signer_basis_number: { type: string, maxLength: 100 }
        bank_account: { type: string, pattern: '^[0-9]{20}$' }
        bank_name: { type: string, maxLength: 300 }
        bank_corr_account: { type: string, pattern: '^[0-9]{20}$' }
        bank_bik: { type: string, pattern: '^[0-9]{9}$' }
        blogger_full_name:
          type: string
          maxLength: 200
          description: |
            ФИО блогера для выплат. Только с кабинетом блогера; у `legal_entity` — `422 not_allowed`,
            у `sole_proprietor` и `self_employed` обязательно, без значения берётся `name`
    OrganizationCreate:
      allOf:
        - $ref: '#/components/schemas/OrganizationFields'
        - type: object
          required: [cabinet, legal_type, inn, name, contact_name, phone]
          properties:
            cabinet: { $ref: '#/components/schemas/Cabinet' }
            legal_type: { $ref: '#/components/schemas/LegalType' }
            inn:
              type: string
              pattern: '^([0-9]{10}|[0-9]{12})$'
              description: |
                10 цифр у юрлица, 12 у остальных; проверяются контрольные цифры ФНС. Отказы — `422`
                с `details.reason` `invalid_length` (длина не по `legal_type`) или `invalid_checksum`
    OrganizationUpdate:
      $ref: '#/components/schemas/OrganizationFields'
    Organization:
      allOf:
        - $ref: '#/components/schemas/OrganizationFields'
        - type: object
          required: [id, legal_type, inn, name, contact_name, phone, status, cabinets, tax_document_uploaded, created_at]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            legal_type: { $ref: '#/components/schemas/LegalType' }
            inn: { type: string }
            status: { type: string, enum: [active, blocked] }
            cabinets:
              type: array
              items: { $ref: '#/components/schemas/Cabinet' }
            tax_document_uploaded:
              type: boolean
              description: Документ о режиме налогообложения загружен (нужен блогеру)
            created_at: { type: string, format: date-time }

    # ------------------------------------------------ legal, notifications
    LegalDocument:
      type: object
      required: [id, kind, version, published_at, title, url, accepted]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, enum: [advertiser_offer, blogger_offer, platform_rules, privacy_policy] }
        version: { type: integer, example: 1, description: Номер версии внутри вида; действующая — наибольшая }
        published_at: { type: string, format: date-time }
        title: { type: string }
        url: { type: string, format: uri, description: Кратковременная подписанная ссылка на файл }
        accepted: { type: boolean, description: Принят текущей организацией }
    LegalAcceptanceRequest:
      type: object
      required: [legal_document_ids]
      properties:
        legal_document_ids:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Uuid' }
    Notification:
      type: object
      required: [id, template, title, text, created_at, is_read]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        template:
          type: string
          example: placement.request
          description: Код шаблона из каталога уведомлений (04 §8)
        title: { type: string }
        text: { type: string, description: Текст без разметки }
        object_type: { type: string, example: placement }
        object_id: { $ref: '#/components/schemas/Uuid' }
        order_id:
          allOf: [{ $ref: '#/components/schemas/Uuid' }]
          description: Заказ, к которому относится уведомление (размещение, пост, маркировка)
        link:
          type: string
          example: /adv/orders/0190a000-0000-7000-8000-000000000101
          description: Путь в кабинете к объекту уведомления; нет — объект без своей страницы
        is_read: { type: boolean }
        created_at: { type: string, format: date-time }

    # ------------------------------------------------ catalog
    ChannelCategory:
      type: object
      required: [id, slug, name]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        slug: { type: string, example: food }
        name: { type: string, example: Еда и кулинария }
    PlacementFormat:
      type: object
      required: [id, name, top_hours, duration_hours]
      properties:
        id: { $ref: '#/components/schemas/PlacementFormatId' }
        name: { type: string, example: 1/24 }
        top_hours: { type: integer, description: Сколько часов пост должен быть последним в канале }
        duration_hours: { type: integer, description: Через сколько часов пост снимается }
    CatalogPrice:
      type: object
      required: [format_id, total_amount]
      properties:
        format_id: { $ref: '#/components/schemas/PlacementFormatId' }
        total_amount: { $ref: '#/components/schemas/Money' }
    ChannelRef:
      type: object
      required: [id, title]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        title: { type: string }
        icon_url: { type: string, format: uri }
        link: { type: string, format: uri }
    CatalogChannel:
      type: object
      required: [id, title, link, category, subscribers_count, rating, prices]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        title: { type: string }
        icon_url: { type: string, format: uri }
        link:
          type: string
          description: Ссылка канала из MAX, в том числе приватная; пустая строка, если MAX не вернул ссылку.
        description: { type: string }
        category: { $ref: '#/components/schemas/ChannelCategory' }
        subscribers_count: { type: integer }
        avg_views: { type: integer }
        engagement_bp: { type: integer, description: Вовлечённость в базисных пунктах }
        rating: { type: integer, minimum: 0, maximum: 100 }
        rkn_number: { type: string }
        anomaly_flags:
          type: array
          items: { type: string, enum: [subscribers_spike, views_disproportion] }
        prices:
          type: array
          description: Только включённые форматы
          items: { $ref: '#/components/schemas/CatalogPrice' }
        cpv:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: |
            Цена за просмотр: цена формата `format_id` (без него — минимальная включённая) / `avg_views`,
            в копейках с округлением вниз. Нет `avg_views` — поля нет
        in_cart: { type: boolean }
    CatalogChannelDetail:
      allOf:
        - $ref: '#/components/schemas/CatalogChannel'
        - type: object
          required: [metrics_history, unavailability]
          properties:
            max_description: { type: string }
            posts_per_week: { type: number, format: double }
            metrics_history:
              type: array
              description: Суточные снимки за 30 дней
              items: { $ref: '#/components/schemas/ChannelMetricsPoint' }
            unavailability:
              type: array
              description: Недоступность, заданная блогером, и интервалы, занятые размещениями; по началу
              items: { $ref: '#/components/schemas/Unavailability' }
    ChannelMetricsPoint:
      type: object
      required: [date, subscribers_count]
      properties:
        date: { type: string, format: date }
        subscribers_count: { type: integer }
        avg_views: { type: integer }

    # ------------------------------------------------ cart
    CartItemCreate:
      type: object
      required: [channel_id, format_id]
      properties:
        channel_id: { $ref: '#/components/schemas/Uuid' }
        format_id: { $ref: '#/components/schemas/PlacementFormatId' }
    CartItemUpdate:
      type: object
      required: [format_id]
      properties:
        format_id: { $ref: '#/components/schemas/PlacementFormatId' }
    CartItem:
      type: object
      required: [id, channel, format_id, shown_total_amount, price_changed, available]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        channel: { $ref: '#/components/schemas/ChannelRef' }
        format_id: { $ref: '#/components/schemas/PlacementFormatId' }
        shown_total_amount: { $ref: '#/components/schemas/Money' }
        current_total_amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Нет, если формат канала выключен
        price_changed: { type: boolean }
        available: { type: boolean, description: Канал виден в каталоге (правила — в `listCatalogChannels`) и формат включён }
    Cart:
      type: object
      required: [items, total_amount]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CartItem' }
        total_amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Сумма `current_total_amount` доступных позиций

    # ------------------------------------------------ campaigns and posts
    CampaignInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        date_from: { type: string, format: date }
        date_to: { type: string, format: date }
        time_from: { $ref: '#/components/schemas/TimeOfDay' }
        time_to: { $ref: '#/components/schemas/TimeOfDay' }
        extra_requirements: { type: string, maxLength: 2000 }
    Campaign:
      type: object
      required: [id, name, status, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        status: { $ref: '#/components/schemas/CampaignStatus' }
        date_from: { type: string, format: date }
        date_to: { type: string, format: date }
        time_from: { $ref: '#/components/schemas/TimeOfDay' }
        time_to: { $ref: '#/components/schemas/TimeOfDay' }
        extra_requirements: { type: string }
        order_id: { $ref: '#/components/schemas/Uuid' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EditorDoc:
      type: object
      description: Документ редактора; схема равна набору форматирования MAX (05 §2.5)
      required: [type, content]
      properties:
        type: { type: string, enum: [doc] }
        content:
          type: array
          items: { $ref: '#/components/schemas/EditorBlock' }
    EditorBlock:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [paragraph, heading, blockquote] }
        content:
          type: array
          items: { $ref: '#/components/schemas/EditorText' }
    EditorText:
      type: object
      required: [type, text]
      properties:
        type: { type: string, enum: [text] }
        text: { type: string }
        marks:
          type: array
          items: { $ref: '#/components/schemas/EditorMark' }
    EditorMark:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [bold, italic, underline, strike, code, link, highlight] }
        href: { type: string, pattern: '^https://', description: Только для `link` }
    PostDraftInput:
      type: object
      required: [content_doc, media_file_ids]
      properties:
        content_doc: { $ref: '#/components/schemas/EditorDoc' }
        media_file_ids:
          type: array
          maxItems: 10
          description: Изображения альбома по порядку
          items: { $ref: '#/components/schemas/Uuid' }
        token_carrier: { $ref: '#/components/schemas/TokenCarrier' }
        token_position: { $ref: '#/components/schemas/TokenPosition' }
    PostDraft:
      type: object
      required: [campaign_id, content_doc, media, token_carrier, token_position, updated_at]
      properties:
        campaign_id: { $ref: '#/components/schemas/Uuid' }
        content_doc: { $ref: '#/components/schemas/EditorDoc' }
        media:
          type: array
          items: { $ref: '#/components/schemas/MediaFile' }
        token_carrier: { $ref: '#/components/schemas/TokenCarrier' }
        token_position: { $ref: '#/components/schemas/TokenPosition' }
        updated_at: { type: string, format: date-time }
    PostPreview:
      type: object
      required: [body, body_length, body_limit, final_text_sample, media_urls, problems]
      properties:
        body: { type: string, description: Текст в формате API MAX без строки маркировки }
        body_length: { type: integer }
        body_limit: { type: integer, example: 3800 }
        final_text_sample: { type: string, description: Итоговый текст с условным erid }
        media_urls:
          type: array
          description: |
            Изображения в том виде, в каком уйдут в канал (с плашкой при `token_carrier=media`).
            Подписанные ссылки со сроком действия; изображения, которые ещё строятся, не входят.
          items: { type: string, format: uri }
        problems:
          type: array
          description: Нарушения автоматических проверок; пусто — пост можно оплачивать
          items: { $ref: '#/components/schemas/PostProblem' }
    PostProblem:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            - `empty_text` — в посте нет текста;
            - `body_too_long` — текст с разметкой и UTM-метками длиннее 3800 знаков;
            - `too_many_media` — изображений больше предела альбома;
            - `link_not_https` — ссылка не `https://`;
            - `media_required_for_token` — `token_carrier = media`, а изображений нет;
            - `link_required_for_token` — `token_position = link`, а ссылок нет;
            - `media_processing` — изображения с плашкой или их копии ещё строятся;
            - `requisites_missing` — у организации нет названия или ИНН.
          enum:
            - empty_text
            - body_too_long
            - too_many_media
            - link_not_https
            - media_required_for_token
            - link_required_for_token
            - media_processing
            - requisites_missing
        message: { type: string }
    PostVersion:
      type: object
      required: [id, number, status, token_carrier, token_position, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        number: { type: integer }
        status: { $ref: '#/components/schemas/PostVersionStatus' }
        body: { type: string }
        final_text: { type: string, description: Есть с состояния `ready` }
        erid: { type: string, description: Есть с состояния `ready` }
        media_urls:
          type: array
          items: { type: string, format: uri }
        token_carrier: { $ref: '#/components/schemas/TokenCarrier' }
        token_position: { $ref: '#/components/schemas/TokenPosition' }
        rejection_reason: { type: string }
        created_at: { type: string, format: date-time }

    # ------------------------------------------------ media
    MediaFile:
      type: object
      required: [id, original_name, mime, size_bytes, width, height, preview_url, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        original_name: { type: string }
        mime: { type: string, enum: [image/jpeg, image/png, image/webp] }
        size_bytes: { type: integer, format: int64 }
        width: { type: integer }
        height: { type: integer }
        preview_url:
          type: string
          format: uri
          description: |
            Подписанная ссылка со сроком действия на уменьшенную копию. Пока копия строится,
            ссылка ведёт на оригинал.
        created_at: { type: string, format: date-time }

    # ------------------------------------------------ orders and placements
    OrderSummary:
      type: object
      required: [id, number, campaign_id, campaign_name, status, total_amount, placements_count, placements_by_status, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        number: { type: integer, format: int64 }
        campaign_id: { $ref: '#/components/schemas/Uuid' }
        campaign_name: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        total_amount: { $ref: '#/components/schemas/Money' }
        placements_count: { type: integer }
        placements_by_status:
          type: object
          description: Число размещений по состояниям
          additionalProperties: { type: integer }
        created_at: { type: string, format: date-time }
    Order:
      allOf:
        - $ref: '#/components/schemas/OrderSummary'
        - type: object
          required: [current_post_version, placements]
          properties:
            current_post_version: { $ref: '#/components/schemas/PostVersion' }
            placements:
              type: array
              items: { $ref: '#/components/schemas/AdvertiserPlacement' }
    PlacementTiming:
      type: object
      required: [format_id, top_hours, duration_hours, window_start, window_end, time_from, time_to]
      properties:
        format_id: { $ref: '#/components/schemas/PlacementFormatId' }
        top_hours: { type: integer }
        duration_hours: { type: integer }
        window_start: { type: string, format: date-time }
        window_end: { type: string, format: date-time }
        time_from: { $ref: '#/components/schemas/TimeOfDay' }
        time_to: { $ref: '#/components/schemas/TimeOfDay' }
        accept_deadline_at: { type: string, format: date-time, description: T-01 }
        schedule_deadline_at: { type: string, format: date-time, description: T-13 }
        publish_at: { type: string, format: date-time }
        remove_at: { type: string, format: date-time }
        published_at: { type: string, format: date-time }
        removed_at: { type: string, format: date-time }
        claim_deadline_at: { type: string, format: date-time, description: T-05 }
    AdvertiserPlacement:
      allOf:
        - $ref: '#/components/schemas/PlacementTiming'
        - type: object
          required: [id, order_id, channel, status, status_changed_at, total_amount, history, available_actions]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            order_id: { $ref: '#/components/schemas/Uuid' }
            channel: { $ref: '#/components/schemas/ChannelRef' }
            status: { $ref: '#/components/schemas/PlacementStatus' }
            status_reason: { type: string }
            status_changed_at: { type: string, format: date-time }
            total_amount: { $ref: '#/components/schemas/Money' }
            refund_amount: { $ref: '#/components/schemas/Money' }
            performance_share: { type: integer, minimum: 0, maximum: 10000 }
            publication_url: { type: string, format: uri, description: Публичная ссылка на пост в MAX }
            views:
              type: integer
              description: Просмотры поста — последнее считанное значение; после снятия — итоговое
            claim: { $ref: '#/components/schemas/PlacementClaim' }
            dispute: { $ref: '#/components/schemas/PlacementDisputeSummary' }
            history:
              type: array
              items: { $ref: '#/components/schemas/PlacementHistoryEntry' }
            available_actions:
              type: array
              description: |
                Действия, допустимые сейчас: `cancel` — из `created` и `awaiting_blogger`; `accept` — из
                `removed`; `claim` — из `published` и из `removed` до `claim_deadline_at`, если претензии нет.
              items: { $ref: '#/components/schemas/AdvertiserPlacementAction' }
    PlacementClaim:
      type: object
      required: [reason, text, created_at]
      properties:
        reason: { $ref: '#/components/schemas/ClaimReason' }
        text: { type: string }
        created_at: { type: string, format: date-time }
    PlacementDisputeSummary:
      type: object
      description: |
        Спор по размещению (03 §6): открыт рекламодателем, системой при нарушении или администратором.
        Решение принимает администратор; предложение доли в кабинетах не показывается.
      required: [reason, opened_by_type, opened_at, deadline_at]
      properties:
        reason:
          type: string
          enum: [removed_early, content_modified, top_violated, bot_access_lost, content_mismatch, other, admin]
        opened_by_type: { type: string, enum: [advertiser, system, admin] }
        opened_at: { type: string, format: date-time }
        deadline_at: { type: string, format: date-time, description: T-06 }
        resolution:
          type: string
          enum: [full_payout, proportional, full_refund]
          description: Решение администратора (P-15); нет — спор открыт. Основание решения сторонам не показывается.
        resolved_at: { type: string, format: date-time }
    PlacementHistoryEntry:
      type: object
      required: [transition, to_status, actor_type, created_at]
      properties:
        transition: { type: string, example: P-03 }
        from_status: { $ref: '#/components/schemas/PlacementStatus' }
        to_status: { $ref: '#/components/schemas/PlacementStatus' }
        actor_type: { type: string, enum: [advertiser, blogger, admin, system] }
        reason_code: { type: string }
        created_at: { type: string, format: date-time }
    ClaimCreate:
      type: object
      required: [reason, text]
      properties:
        reason: { $ref: '#/components/schemas/ClaimReason' }
        text: { type: string, minLength: 1, maxLength: 2000 }
    OrderReport:
      type: object
      required: [order_id, order_number, campaign_name, totals, rows, links, utm]
      properties:
        order_id: { $ref: '#/components/schemas/Uuid' }
        order_number: { type: integer, format: int64 }
        campaign_name: { type: string }
        links:
          type: array
          description: |
            Адреса ссылок текущей версии поста с UTM-метками — как ушли в канал. Переходы платформа не
            считает (A-21): их видит аналитика рекламодателя по `utm_campaign`.
          items: { type: string, format: uri }
          example: ['https://shop.example.test/sale?utm_source=max&utm_medium=channel_ad&utm_campaign=order_1001']
        utm: { $ref: '#/components/schemas/OrderReportUtm' }
        totals: { $ref: '#/components/schemas/OrderReportTotals' }
        rows:
          type: array
          items: { $ref: '#/components/schemas/OrderReportRow' }
    OrderReportTotals:
      type: object
      required: [placements, published, views, spent_amount, refunded_amount, held_amount]
      properties:
        placements: { type: integer }
        published: { type: integer, description: 'Размещения, которые выходили в канал' }
        views: { type: integer }
        spent_amount: { $ref: '#/components/schemas/Money' }
        refunded_amount: { $ref: '#/components/schemas/Money' }
        held_amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Ещё удержано — сумма `held_amount` строк
        cpv_amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: |
            Цена одного просмотра (D-28): `spent_amount`, делённое на `views`, в копейках с округлением
            вниз. Нет — просмотров нет
    OrderReportUtm:
      type: object
      description: UTM-метки ссылок поста заказа (A-21)
      required: [source, medium, campaign]
      properties:
        source: { type: string, example: max }
        medium: { type: string, example: channel_ad }
        campaign: { type: string, example: order_1001 }
    OrderReportRow:
      type: object
      description: |
        Строка отчёта по размещению. Суммы строк в сумме дают `totals.spent_amount` и
        `totals.refunded_amount`.
      required: [placement_id, channel, status, spent_amount, refunded_amount, held_amount]
      properties:
        placement_id: { $ref: '#/components/schemas/Uuid' }
        channel: { $ref: '#/components/schemas/ChannelRef' }
        status: { $ref: '#/components/schemas/PlacementStatus' }
        spent_amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Списано за размещение — цена с комиссией за вычетом возврата; есть с `accepted`
        refunded_amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Возвращено на баланс рекламодателя
        held_amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Ещё удержано — размещение не завершено или в споре
        published_at: { type: string, format: date-time }
        removed_at: { type: string, format: date-time }
        views: { type: integer }
        publication_url: { type: string, format: uri }
        utm_campaign: { type: string, example: order_1001 }
        cpv_amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Цена одного просмотра — `spent_amount`, делённое на `views`, с округлением вниз; нет — просмотров нет или ничего не списано

    # ------------------------------------------------ balance
    Balance:
      type: object
      required: [available_amount, held_amount]
      properties:
        available_amount: { $ref: '#/components/schemas/Money' }
        held_amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Удержано по активным размещениям
    BalanceTransaction:
      type: object
      required: [id, kind, amount, created_at, description]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, enum: [deposit, hold, hold_release, refund, balance_return, manual], description: Вид операции с точки зрения рекламодателя }
        amount: { $ref: '#/components/schemas/SignedMoney' }
        description: { type: string }
        order_id: { $ref: '#/components/schemas/Uuid' }
        placement_id: { $ref: '#/components/schemas/Uuid' }
        invoice_id: { $ref: '#/components/schemas/Uuid' }
        created_at: { type: string, format: date-time }
    InvoiceCreate:
      type: object
      required: [amount]
      properties:
        amount:
          type: integer
          format: int64
          minimum: 100
          maximum: 100000000000
          description: Сумма в копейках. Обычно от 1 000 ₽; на dev с включёнными реальными пополнениями и кодом назначения — от 1 ₽. Сервер проверяет действующий режим и границы.
    Invoice:
      type: object
      required: [id, number, amount, status, expires_at, created_at, pdf_url]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        number: { type: string, example: MX-000101 }
        amount: { $ref: '#/components/schemas/Money' }
        status: { $ref: '#/components/schemas/InvoiceStatus' }
        expires_at: { type: string, format: date-time }
        paid_at: { type: string, format: date-time }
        paid_amount: { $ref: '#/components/schemas/Money' }
        pdf_url: { type: string, description: Относительный адрес PDF }
        payment_details: { $ref: '#/components/schemas/InvoicePaymentDetails' }
        created_at: { type: string, format: date-time }
    InvoicePaymentCheck:
      type: object
      required: [invoice, result, retry_after]
      properties:
        invoice: { $ref: '#/components/schemas/Invoice' }
        result: { type: string, enum: [paid, not_found, busy, unavailable] }
        checked_at: { type: string, format: date-time }
        retry_after: { type: integer, minimum: 0, description: Через сколько секунд разрешена следующая ручная проверка }
    InvoicePaymentDetails:
      type: object
      description: Реквизиты из того же снимка, что и PDF нового счёта. Возвращаются при создании; для исторических счетов использовать PDF.
      required: [recipient, inn, account, bank, bik, corr_account, purpose]
      properties:
        recipient: { type: string }
        inn: { type: string }
        account: { type: string }
        bank: { type: string }
        bik: { type: string }
        corr_account: { type: string }
        purpose: { type: string, description: Полное назначение платежа для копирования }
    ClosingDocument:
      type: string
      enum: [report, act]
      description: report — отчёт агента, act — акт на вознаграждение
    ClosingAct:
      type: object
      required: [id, number, period, placements_amount, fee_amount, report_url, act_url, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        number: { type: string, example: А-000001 }
        period: { type: string, pattern: '^\d{4}-\d{2}$', example: 2026-10, description: Месяц по Москве }
        placements_amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Выплачено блогерам по размещениям месяца
        fee_amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Вознаграждение платформы
        report_url: { type: string, description: Относительный адрес PDF отчёта агента }
        act_url: { type: string, description: Относительный адрес PDF акта }
        created_at: { type: string, format: date-time }

    # ------------------------------------------------ blogger
    Unavailability:
      type: object
      required: [id, starts_at, ends_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
    UnavailabilityInput:
      type: object
      required: [starts_at, ends_at]
      properties:
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
    BloggerPrice:
      type: object
      required: [format_id, amount, is_enabled, total_amount]
      properties:
        format_id: { $ref: '#/components/schemas/PlacementFormatId' }
        amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Цена блогера без комиссии
        is_enabled: { type: boolean }
        total_amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Цена для рекламодателя, с комиссией платформы
    BloggerChannel:
      type: object
      required: [id, title, is_public, status, subscribers_count, bot_is_admin, bot_permissions, missing_permissions, rkn_status, rating, prices, unavailability]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        title: { type: string }
        icon_url: { type: string, format: uri }
        link: { type: string, format: uri }
        is_public:
          type: boolean
          description: Фактическая публичность из MAX; приватные каналы также допускаются.
        status: { $ref: '#/components/schemas/ChannelStatus' }
        status_reason:
          type: string
          description: |
            Код причины состояния: `missing_rights` — у бота нет
            прав из `missing_permissions`; `unclaimed_expired` — канал не подключён кодом за 7 суток;
            `rkn_required` — канал приостановлен до подтверждения номера РКН; `blocked_by_admin` —
            канал заблокирован администратором; текст отказа модерации для `rejected`.
        description: { type: string }
        category_id: { $ref: '#/components/schemas/Uuid' }
        subscribers_count: { type: integer }
        bot_is_admin: { type: boolean }
        bot_permissions:
          type: array
          items: { type: string }
        missing_permissions:
          type: array
          description: Обязательные права бота (`write`, `delete`), которых нет (A-01)
          items: { type: string }
        rkn_number: { type: string }
        rkn_status: { $ref: '#/components/schemas/RknStatus' }
        rating: { type: integer, minimum: 0, maximum: 100 }
        prices:
          type: array
          items: { $ref: '#/components/schemas/BloggerPrice' }
        unavailability:
          type: array
          items: { $ref: '#/components/schemas/Unavailability' }
    BloggerChannelUpdate:
      type: object
      properties:
        description: { type: string, maxLength: 2000 }
        category_id: { $ref: '#/components/schemas/Uuid' }
        rkn_number: { type: string, maxLength: 50 }
    ChannelPricesInput:
      type: object
      required: [prices]
      properties:
        prices:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ChannelPriceInput' }
    ChannelPriceInput:
      type: object
      required: [format_id, amount, is_enabled]
      properties:
        format_id: { $ref: '#/components/schemas/PlacementFormatId' }
        amount: { type: integer, format: int64, minimum: 1, maximum: 1000000000 }
        is_enabled: { type: boolean }
    ChannelConnection:
      type: object
      required: [id, status, expires_at, candidates]
      properties:
        id: { type: string, format: uuid }
        channel_name:
          type: string
          description: Введённое имя, @тег, ссылка или ID для подключения по доступу бота.
        status:
          type: string
          enum: [pending, checking, ready, connecting, connected, failed, expired]
        expires_at: { type: string, format: date-time }
        reason:
          type: string
          enum: [expired, max_unavailable, user_rights_required, bot_rights_required, not_channel, linked_to_other, channel_unavailable, channel_changed, channel_not_found, channel_name_ambiguous]
        channel_id: { type: string, format: uuid }
        candidates:
          type: array
          items: { $ref: '#/components/schemas/ChannelConnectionCandidate' }
    ChannelConnectionCandidate:
      type: object
      required: [id, title, link, icon_url]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        link: { type: string }
        icon_url: { type: string }
    ChannelLinkCode:
      type: object
      required: [code, expires_at, bot_name, instruction]
      properties:
        code: { type: string, pattern: '^[2-9A-HJ-NP-Z]{8}$', example: K7M2Q9XA }
        expires_at: { type: string, format: date-time }
        bot_name: { type: string, example: '@test_ads_bot' }
        instruction: { type: string }
    BloggerPost:
      type: object
      description: Пост размещения. Есть, пока версия поста размещения в `ready` и размещение не в `created`
      required: [final_text, media_urls, erid]
      properties:
        final_text: { type: string }
        media_urls:
          type: array
          items: { type: string, format: uri }
        erid: { type: string }
        extra_requirements: { type: string }
    BloggerPlacement:
      allOf:
        - $ref: '#/components/schemas/PlacementTiming'
        - type: object
          required: [id, order_number, channel, status, status_changed_at, blogger_amount, available_actions]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            order_number: { type: integer, format: int64 }
            advertiser_name: { type: string }
            channel: { $ref: '#/components/schemas/ChannelRef' }
            status: { $ref: '#/components/schemas/PlacementStatus' }
            status_reason: { type: string }
            status_changed_at: { type: string, format: date-time }
            blogger_amount:
              allOf: [{ $ref: '#/components/schemas/Money' }]
              description: Сумма блогеру без комиссии платформы
            payout_amount: { $ref: '#/components/schemas/Money' }
            publication_url: { type: string, format: uri, description: Публичная ссылка на пост в MAX }
            views:
              type: integer
              description: Просмотры поста — последнее считанное значение; после снятия — итоговое
            dispute: { $ref: '#/components/schemas/PlacementDisputeSummary' }
            post: { $ref: '#/components/schemas/BloggerPost' }
            available_actions:
              type: array
              description: |
                `accept`, `decline` — из `awaiting_blogger`; `schedule` — из `awaiting_schedule`;
                `reschedule` — из `scheduled`, пока до `publish_at` больше 1 ч
              items: { $ref: '#/components/schemas/BloggerPlacementAction' }
    DeclineInput:
      type: object
      properties:
        comment: { type: string, maxLength: 1000 }
    ScheduleInput:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [at, now] }
        publish_at: { type: string, format: date-time, description: Обязательно при `mode=at` }
    RescheduleInput:
      type: object
      required: [publish_at]
      properties:
        publish_at: { type: string, format: date-time }
    Payout:
      type: object
      required: [id, placement_id, order_number, channel, amount, status, method, attempt, created_at]
      properties:
        workflow: { $ref: '#/components/schemas/RocketworkWorkflow' }
        reconciliation_required: { type: boolean }
        id: { $ref: '#/components/schemas/Uuid' }
        placement_id: { $ref: '#/components/schemas/Uuid' }
        order_number: { type: integer, format: int64 }
        channel: { $ref: '#/components/schemas/ChannelRef' }
        amount: { $ref: '#/components/schemas/Money' }
        status: { $ref: '#/components/schemas/PayoutStatus' }
        method: { $ref: '#/components/schemas/PayoutMethod' }
        attempt: { type: integer }
        receipt_url: { type: string, format: uri }
        failure_code: { $ref: '#/components/schemas/PayoutFailureCode' }
        failure_message: { type: string }
        created_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
    RocketworkStatus:
      type: object
      required: [status, required]
      properties:
        next_action: { type: string, description: 'invite, complete_registration, grant_fns_permissions, add_requisites, contact_support или none' }
        status: { $ref: '#/components/schemas/RocketworkContractorStatus' }
        required: { type: boolean, description: Нужен ли Рокет Ворк (не нужен юрлицу) }
        onboarding_url: { type: string, format: uri }
        blocked_reason:
          type: string
          description: 'Причина блокировки при `status = blocked`: `tax_status_lost` — утрачен статус самозанятого'
        status_checked_at:
          type: string
          format: date-time
          description: Когда статус последний раз сверен с Рокет Ворк
    RocketworkDocument:
      type: object
      required: [kind, url]
      properties:
        kind: { type: string }
        url: { type: string, format: uri }
    RocketworkWorkflow:
      type: object
      required: [stage, provider_status, next_action, documents]
      properties:
        stage: { type: string }
        provider_status: { type: string }
        next_action: { type: string, description: 'sign_agreement, sign_act, submit_receipt, wait_receipt, wait_payment, wait_financial_details, wait_cancellation, contact_support, wait или none' }
        documents:
          type: array
          items: { $ref: '#/components/schemas/RocketworkDocument' }
    PayoutSummary:
      type: object
      required: [received_amount, in_progress_amount, count]
      properties:
        received_amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Выплачено (succeeded)
        in_progress_amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: 'В работе: created и sent'
        count: { type: integer, minimum: 0, description: Всего попыток выплат }

    # ------------------------------------------------ admin: channels
    AdminOrganizationRef:
