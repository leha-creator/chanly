openapi: 3.0.3
info:
  title: Chanly — биржа рекламы в каналах MAX
  version: 0.1.0-draft
  description: |
    HTTP API кабинетов рекламодателя и блогера. Черновик: составлен по документам
    `docs/02-scenarios.md`, `docs/03-placement.md`, `docs/04-domain-model.md`, `docs/08-screens.md`.
    При расхождении правы документы.

    Администратор (07 §4). Операции `/admin/*` требуют роль `moderator` или `senior`; в описании каждой
    операции указано, какой роли она доступна («Роль: moderator, senior» или «Роль: senior»). Без роли —
    `403` с `details.reason = admin_required`. Обеим ролям: модерация каналов и постов, чтение размещений,
    удаление поста и открытие спора, споры и переписка, ошибки и отчёты ОРД (чтение и «Повторить»),
    организации (чтение), счётчики. Только `senior`: отмена размещения и отметка снятия, блокировки,
    справочники, правка организации, выплаты, оплаты и счета, проводки, подтверждения, журнал действий,
    формирование и отправка отчёта ОРД.

    Второе подтверждение (R-2). Ручная проводка, пополнение депозита и отметка выплаты юрлицу на сумму
    больше порога (`LEDGER_MANUAL_SECOND_APPROVAL_THRESHOLD`, 100 000 ₽) не исполняются сразу: ответ `202`
    с запросом `AdminApproval`; операцию исполняет подтверждение другого `senior`.

    ИНН и почта в ответах администратора: у `senior` — полные в организациях, оплатах и выплатах; у
    `moderator` и в ссылках на организации (`AdminOrganizationRef`) — с маской (`77****1234`).

    Соглашения:
    - Деньги — целые копейки (`int64`). Суммы считает сервер; клиент передаёт идентификаторы.
    - Время — RFC 3339 в UTC. Время суток (`time_from`, `time_to`) — `ЧЧ:ММ` по Москве.
    - Идентификаторы — UUID; у формата размещения — строка (`f_1_24`).
    - Сессия — cookie `session` (`HttpOnly`, `SameSite=Lax`; `Secure` при `COOKIE_SECURE=true`,
      обязательно в продакшене), выдаётся при входе.
    - Защита от межсайтовой подделки — двойная отправка: при входе выдаётся cookie `csrf_token`
      (без `HttpOnly`); меняющие запросы (`POST`, `PUT`, `PATCH`, `DELETE`), кроме `/auth/code`
      и `/auth/login`, повторяют её значение в заголовке `X-CSRF-Token`. Без совпадения — `403`
      с `details.reason = csrf` (тестовый сервер заголовок не проверяет).
    - Превышение лимита частоты — `429` с кодом `rate_limited` и заголовком `Retry-After` в секундах.
    - Операция, которую бэкенд ещё не реализует, отвечает `501` с кодом `not_implemented`.
    - Любой запрос сначала проверяется по этой спецификации: параметр пути, запроса или заголовка
      вне схемы (не UUID в `{id}`, `limit` вне 1…100, `Idempotency-Key` длиннее 64) — `422`
      `validation_failed`, даже если у операции `422` не указан.
    - Переход размещения, недопустимый из текущего состояния, отклоняется ответом `409` с кодом `invalid_transition`.
    - Каждый ответ содержит заголовок `X-Request-Id`; по нему запрос находится в журнале.

    Операции с тегом `_mock` есть только в тестовом сервере.
servers:
  - url: /api/v1
    description: Тот же адрес, с которого открыта документация
security:
  - session: []
tags:
  - name: auth
    description: Вход по почте с одноразовым кодом (S-01, S-10; экран `auth/login`)
  - name: organizations
    description: Реквизиты организации (S-01, S-10; `auth/org-adv`, `auth/org-blg`, `adv/profile`, `blg/profile`)
  - name: legal
    description: Оферты и правила, их принятие
  - name: notifications
    description: Уведомления в кабинете (`common/notifications`)
  - name: catalog
    description: Каталог каналов (S-02; `adv/catalog`, `adv/channel`)
  - name: cart
    description: Корзина (S-03; `adv/cart`)
  - name: campaigns
    description: Кампании и единый пост (S-04, S-05, S-06; `adv/campaigns`, `adv/campaign-new`, `adv/campaign-post`)
  - name: media
    description: Медиатека (`adv/media`)
  - name: orders
    description: Заказы и размещения рекламодателя (S-07, S-08, S-09, S-29; `adv/orders`, `adv/order`, `adv/report`)
  - name: balance
    description: Баланс и счета (S-06, S-33; `adv/balance`)
  - name: blogger-channels
    description: Каналы блогера (S-12, S-13; `blg/channels`, `blg/channel-add`, `blg/channel`)
  - name: blogger-placements
    description: Запросы и размещения блогера (S-14; `blg/placements`, `blg/placement`)
  - name: blogger-payouts
    description: Выплаты и Рокет Ворк (S-11, S-15; `blg/payouts`)
  - name: admin-channels
    description: |
      Модерация каналов и проверка номера РКН (S-16, 06 §6.3), блокировка канала (S-19). Нужна роль
      администратора (07 §4), иначе `403` с `details.reason = admin_required`.
  - name: admin-dictionaries
    description: Справочники администратора (категории каналов)
  - name: admin-orders
    description: Модерация поста заказа (S-17; `adm/moderation`)
  - name: admin-placements
    description: Размещения и ручные операции (S-19; `adm/placements`)
  - name: admin-disputes
    description: Споры (S-18; `adm/disputes`)
  - name: admin-payouts
    description: Реестр выплат блогерам (`adm/payouts`)
  - name: admin-payments
    description: Выписки, поступления и счета (S-30; `adm/payments`)
  - name: admin-ledger
    description: Журнал денег, сверка и ручные проводки (06 §2.4; `adm/ledger`)
  - name: admin-approvals
    description: Второе подтверждение ручных денежных операций (07 §4)
  - name: admin-organizations
    description: Организации и пользователи (S-20; `adm/organizations`)
  - name: admin-audit
    description: Журнал действий (`adm/audit`)
  - name: admin-ord
    description: Ошибки и отчётность ОРД (S-20, S-31; `adm/ord`)
  - name: admin
    description: Общее для кабинета администратора
  - name: webhooks
    description: Входящие события внешних систем. Тестовый сервер принимает и ничего не делает
  - name: _mock
    description: Управление тестовым сервером. Только в тестовом сервере

paths:
  /events:
    get:
      operationId: subscribeEvents
      tags: [realtime]
      summary: SSE v1 — изменения данных текущего пользователя и организации
      description: |
        Cookie session; audience определяется сервером, параметры user_id/organization_id
        не предоставляют доступ. Административные темы сюда не поступают.
        Сначала ready после регистрации подписки, затем invalidate и heartbeat каждые 15 секунд.
        Именованные ready, heartbeat, resync_required содержат {"version":1}.
        invalidate содержит RealtimeInvalidation, JSON не более 4096 символов, без бизнес-данных.
        После ready/resync_required клиент перечитывает данные обычными GET.
        Replay/Last-Event-ID отсутствует. При сбое внутреннего reader, overflow или shutdown
        соединение закрывается; после reconnect новый ready требует resync.
        Права проверяются перед каждым сообщением и каждую секунду без продления сессии;
        ошибка проверки закрывает поток. См. docs/realtime.md для границ задержки.
      responses:
        '200':
          description: UTF-8 SSE, немедленный flush, Cache-Control no-cache
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-cache] }
          content:
            text/event-stream:
              schema: { type: string }
              example: "event: ready\ndata: {\"version\":1}\n\nevent: heartbeat\ndata: {\"version\":1}\n\n"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: Reader восстанавливается; повторить подключение после Retry-After
          headers:
            Retry-After:
              schema: { type: string, example: '1' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /admin/events:
    get:
      operationId: subscribeAdminEvents
      tags: [realtime, admin]
      summary: SSE v1 — административные изменения и личные уведомления
      description: |
        Роль: moderator, senior. Организация не требуется. Session/AdminGate и
        IP allowlist Caddy для /admin/* обязательны. Формат и восстановление как /events.
        moderator получает channel/order/placement/dispute/ord/organization/counters;
        finance и audit — только senior. Личные уведомления изолированы по user_id.
        Смена роли, организации или кабинетов закрывает старый поток.
      responses:
        '200':
          description: UTF-8 SSE v1, ready первым, heartbeat каждые 15 секунд
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-cache] }
          content:
            text/event-stream:
              schema: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Reader восстанавливается; повторить подключение после Retry-After
          headers:
            Retry-After:
              schema: { type: string, example: '1' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  # ---------------------------------------------------------------- auth
  /auth/code:
    post:
      tags: [auth]
      operationId: requestLoginCode
      summary: Запросить код входа
      description: |
        Отправляет 6-значный код на почту. Ответ одинаков для существующего и нового адреса.
        В тестовом сервере письмо не отправляется, код всегда `000000`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginCodeRequest' }
            example: { email: adv@example.test }
      responses:
        '202':
          description: Код отправлен
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginCodeResponse' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Войти по коду
      description: |
        Проверяет код и выдаёт cookie сессии. Если пользователя нет — создаёт его;
        тогда `organizations` пуст и кабинет ведёт на заполнение реквизитов.
        Верный код заблокированного пользователя — `403` с `details.reason = user_blocked`; любой
        другой отказ (неверный, истёкший или сгоревший код) — `401`. Код сгорает после
        `AUTH_LOGIN_CODE_ATTEMPTS` (5) неверных попыток; отдельного лимита частоты у входа нет.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example: { email: adv@example.test, code: '000000' }
      responses:
        '200':
          description: Вход выполнен
          headers:
            Set-Cookie:
              description: Cookie `session` и `csrf_token`
              schema: { type: string }
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Выйти
      responses:
        '204':
          description: Сессия закрыта
          headers:
            Set-Cookie:
              description: Очищенные cookie `session` и `csrf_token`
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Текущий пользователь и его организации
      responses:
        '200':
          description: Пользователь
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------------------------------------------------------- organizations
  /organizations:
    post:
      tags: [organizations]
      operationId: createOrganization
      summary: Заполнить реквизиты и открыть кабинет
      description: |
        Создаёт организацию пользователя с профилем рекламодателя или блогера. Если организация
        уже есть — добавляет к ней второй профиль («стать блогером», «стать рекламодателем»);
        реквизиты в этом случае не меняются, но поля, обязательные для блогера, передаются.
        При добавлении профиля `inn` и `legal_type` должны совпадать с организацией (иначе `422`
        с `details.field = inn`, `details.reason = immutable`), а поля, не нужные этому профилю,
        молча отбрасываются: у рекламодателя — все поля блогера, у блогера — `name`, `contact_name`,
        `phone`, `address` и банковские реквизиты. Профиль уже открыт — `409 conflict` с
        `details.reason = cabinet_already_open`.
        КПП, `tax_regime`, `vat_rate`, `blogger_full_name` и данные подписанта есть только у блогера
        (D-24): при создании организации рекламодателя они отклоняются (`422 not_allowed`).
        Допустимые `tax_regime` зависят от `legal_type`,
        допустимые `vat_rate` — от `tax_regime` (04 §2). Документ о режиме налогообложения
        загружается отдельно: `PUT /organizations/current/tax-document`.
        ИНН, уже принадлежащий другой организации, — `409` с кодом `inn_taken`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationCreate' }
            example:
              cabinet: advertiser
              legal_type: legal_entity
              inn: '7707083893'
              name: ООО «Тестовый рекламодатель»
              contact_name: Иван Тестов
              phone: '+79990000001'
              address: г. Москва, ул. Примерная, д. 1
      responses:
        '201':
          description: Организация создана или дополнена профилем
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /organizations/current:
    get:
      tags: [organizations]
      operationId: getCurrentOrganization
      summary: Реквизиты своей организации
      responses:
        '200':
          description: Организация
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [organizations]
      operationId: updateCurrentOrganization
      summary: Изменить реквизиты
      description: |
        ИНН и тип лица не меняются. Передаются только изменяемые поля. Пустая строка (или только
        пробелы) очищает необязательное поле: `address`, `signer_*`, `bank_name`, `blogger_full_name`.
        После правки организация проверяется целиком: очистка обязательного для неё поля — `422`
        с `details.reason = required`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationUpdate' }
            example: { phone: '+79990000002', bank_bik: '044525000' }
      responses:
        '200':
          description: Организация
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /organizations/current/tax-document:
    put:
      tags: [organizations]
      operationId: uploadTaxDocument
      summary: Загрузить документ о режиме налогообложения
      description: |
        Документ, подтверждающий режим налогообложения и ставку НДС блогера (04 §2, `auth/org-blg`).
        Только для кабинета блогера (иначе `403` с `details.reason = cabinet_required`). PDF, JPEG
        или PNG до 10 МБ; тип определяется по содержимому. Новый файл заменяет прежний.
        Не больше 10 загрузок в час на пользователя (`429`, `details.scope = user`; `Retry-After`
        всегда 3600).

        Отказы по файлу — `422` с `details.field = file` и `details.reason`: `required` — части `file`
        нет; `malformed` — тело не разбирается как multipart; `empty`; `too_large`; `unsupported_type`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Организация
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  # ---------------------------------------------------------------- legal
  /legal-documents:
    get:
      tags: [legal]
      operationId: listLegalDocuments
      summary: Действующие оферты и правила
      responses:
        '200':
          description: Документы
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/LegalDocument' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /legal-acceptances:
    post:
      tags: [legal]
      operationId: acceptLegalDocuments
      summary: Принять документы
      description: |
        Нет организации — `403` с `details.reason = organization_required`. Документ неизвестен или
        не действующая версия — `404` с `details.legal_document_id`. Документ не нужен открытым
        кабинетам — `422` с `details.field = legal_document_ids`, `details.reason = not_required`
        и `details.legal_document_id`. Повторное принятие ничего не меняет.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LegalAcceptanceRequest' }
            example: { legal_document_ids: ['0190a000-0000-7000-8000-000000000501'] }
      responses:
        '204': { description: Принято }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  # ---------------------------------------------------------------- notifications
  /notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      summary: Уведомления пользователя
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: unread
          in: query
          description: Только непрочитанные
          schema: { type: boolean }
      responses:
        '200':
          description: Уведомления, новые сверху
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Notification' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /notifications/read-all:
    post:
      tags: [notifications]
      operationId: markAllNotificationsRead
      summary: Отметить все прочитанными
      description: Отмечает прочитанными все непрочитанные уведомления пользователя. Повтор безопасен.
      responses:
        '204': { description: Отмечено }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /notifications/{id}/read:
    post:
      tags: [notifications]
      operationId: markNotificationRead
      summary: Отметить прочитанным
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204': { description: Отмечено }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- catalog
  /catalog/channels:
    get:
      tags: [catalog]
      operationId: listCatalogChannels
      summary: Каналы каталога
      description: |
        Нужен открытый кабинет рекламодателя. В каталоге виден канал в состоянии `active`, у которого
        задана категория, площадка зарегистрирована в ОРД, есть включённая цена активного формата
        и подписчиков меньше порога РКН (10 000) или номер РКН подтверждён. Цены — итог для
        рекламодателя, с комиссией платформы.

        Цена для фильтра `price_from`/`price_to` и сортировок по цене и CPV — цена формата `format_id`,
        без него — минимальная включённая цена канала. `cpv` — эта цена, делённая на `avg_views`,
        в копейках с округлением вниз. Каналы без значения ключа сортировки (нет `avg_views`,
        `engagement_bp`) идут в конце; при равенстве ключа порядок — по `id`.

        Курсор относится к своей сортировке: курсор другой сортировки или испорченный — `422`
        с `details.reason = invalid_cursor`. При смене фильтров выдача начинается с первой страницы.

        Другие отказы `422`: `price_from` больше `price_to` — `details.field = price_from`,
        `details.reason = range`; то же для `subscribers_from` (`details.field = subscribers_from`);
        `format_id` не активного формата — `details.field = format_id`, `details.reason = unknown_format`.
      parameters:
        - name: q
          in: query
          description: Поиск по названию и описанию
          schema: { type: string, maxLength: 100 }
        - name: category_id
          in: query
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: format_id
          in: query
          description: Только каналы с включённой ценой этого формата; фильтр по цене применяется к нему
          schema: { $ref: '#/components/schemas/PlacementFormatId' }
        - name: price_from
          in: query
          schema: { $ref: '#/components/schemas/Money' }
        - name: price_to
          in: query
          schema: { $ref: '#/components/schemas/Money' }
        - name: subscribers_from
          in: query
          schema: { type: integer, minimum: 0 }
        - name: subscribers_to
          in: query
          schema: { type: integer, minimum: 0 }
        - name: sort
          in: query
          schema:
            type: string
            enum: [subscribers_desc, price_asc, price_desc, engagement_desc, rating_desc, avg_views_desc, cpv_asc]
            default: subscribers_desc
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Каналы
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/CatalogChannel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /catalog/channels/{id}:
    get:
      tags: [catalog]
      operationId: getCatalogChannel
      summary: Карточка канала
      description: Канал не виден в каталоге (правила — в `listCatalogChannels`) — `404`.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Канал
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogChannelDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /channel-categories:
    get:
      tags: [catalog]
      operationId: listChannelCategories
      summary: Справочник категорий каналов
      responses:
        '200':
          description: Категории по порядку
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ChannelCategory' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /placement-formats:
    get:
      tags: [catalog]
      operationId: listPlacementFormats
      summary: Справочник форматов размещения
      responses:
        '200':
          description: Активные форматы по порядку
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PlacementFormat' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- cart
  /cart:
    get:
      tags: [cart]
      operationId: getCart
      summary: Корзина
      description: Для каждой позиции — текущая цена и признаки, мешающие оформлению.
      responses:
        '200':
          description: Корзина
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /cart/items:
    post:
      tags: [cart]
      operationId: addCartItem
      summary: Добавить канал в корзину
      description: |
        Один канал — одна позиция. Канал должен быть виден в каталоге по правилам `listCatalogChannels`
        (иначе `404`).
        Повторное добавление канала — `409` с `details.reason = already_in_cart`.
        `422` с `details.reason`: `format_unavailable` — формат не активен или цена выключена;
        `own_channel` — канал принадлежит той же организации; `cart_full` — в корзине уже 50 позиций.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CartItemCreate' }
            example: { channel_id: '0190a000-0000-7000-8000-000000000108', format_id: f_1_24 }
      responses:
        '201':
          description: Корзина после добавления
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /cart/items/{id}:
    patch:
      tags: [cart]
      operationId: updateCartItem
      summary: Сменить формат позиции или подтвердить цену
      description: |
        Меняет формат позиции и запоминает текущий итог как показанный (`shown_total_amount`).
        Запрос с тем же форматом подтверждает изменившуюся цену (снимает `price_changed`).
        `422` с `details.reason = format_unavailable` — формат не активен или цена выключена.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CartItemUpdate' }
            example: { format_id: f_2_48 }
      responses:
        '200':
          description: Корзина
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [cart]
      operationId: deleteCartItem
      summary: Убрать позицию
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Корзина
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- campaigns
  /campaigns:
    get:
      tags: [campaigns]
      operationId: listCampaigns
      summary: Кампании рекламодателя
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/CampaignStatus' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Кампании, новые сверху
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Campaign' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      tags: [campaigns]
      operationId: createCampaign
      summary: Новая кампания
      description: |
        Создаёт кампанию в `draft` и пустой пост к ней (D-16). Обязательно только `name`.

        Проверки формы (A-39; полнота кампании проверяется при оплате). Отказ — `422`,
        причина в `details.reason`, поле — в `details.field`:
        - `required` — нет `name` или оно из одних пробелов (пустая строка отклоняется схемой
          с `details.reason = minLength`);
        - `period_order` — `date_from` позже `date_to`;
        - `period_too_long` — период длиннее 14 суток;
        - `period_in_past` — `date_from` (а без неё — `date_to`) раньше сегодняшнего дня по Москве;
          проверяется, только когда даты меняются;
        - `time_pair` — задано только одно из `time_from`, `time_to`;
        - `time_window` — `time_from` не раньше `time_to` или окно короче 1 часа.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampaignInput' }
            example:
              name: Осенняя распродажа
              date_from: '2026-10-20'
              date_to: '2026-10-25'
              time_from: '10:00'
              time_to: '20:00'
              extra_requirements: Не публиковать рядом с рекламой конкурентов
      responses:
        '201':
          description: Кампания
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /campaigns/{id}:
    get:
      tags: [campaigns]
      operationId: getCampaign
      summary: Кампания
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Кампания
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [campaigns]
      operationId: updateCampaign
      summary: Изменить кампанию
      description: |
        Меняет только переданные поля; отсутствующее поле не меняется. Очистить поле нельзя:
        `null` не принимается. Пустая строка не принимается в `name`, а в `extra_requirements`
        сохраняется как есть.

        Наименование меняется всегда; период дат и времени и `extra_requirements` — только в `draft`,
        иначе `409` с `details.reason = not_draft`. Новое значение проверяется вместе с сохранёнными
        полями по тем же правилам, что и в `createCampaign` (`422`, причины там же).
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampaignInput' }
            example: { name: Осенняя распродажа — 2 }
      responses:
        '200':
          description: Кампания
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /campaigns/{id}/post:
    get:
      tags: [campaigns]
      operationId: getCampaignPost
      summary: Черновик поста кампании
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Черновик
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostDraft' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [campaigns]
      operationId: saveCampaignPost
      summary: Сохранить черновик поста
      description: |
        Сохраняет документ редактора, порядок изображений альбома и место токена.
        Черновик можно править и после оформления заказа; в заказ правка попадает только
        через новую версию (`POST /orders/{id}/post-versions`, S-29).

        Перед сохранением документ нормализуется: CRLF и CR заменяются на LF, табуляция — на пробел,
        прочие управляющие символы удаляются; повторы меток в узле убираются; пустые узлы удаляются,
        соседние узлы с одинаковыми метками сливаются; пустой абзац сохраняется. Затем адреса `https://`
        в тексте без ссылки становятся ссылками (D-22): адрес заканчивается пробелом или концом строки,
        в него не входят завершающие `.,;:!?»"'` и `)` без парной `(`. Ответ содержит документ
        после нормализации и распознавания ссылок.

        Если поля места токена не переданы: `token_carrier = media` при наличии изображений, иначе `text`;
        `token_position = below`. Недоступное сочетание не отклоняется, а показывается проблемой предпросмотра.
        Текст длиннее 3800 знаков сохраняется — предпросмотр покажет `body_too_long`.

        Отказ — `422`, причина в `details.reason`:
        - `invalid_doc` — нарушено ограничение документа, путь узла в `details.path` (например,
          `content.2.content.0`), уточнение в `details.rule`: `too_many_blocks` (больше 300),
          `too_many_nodes` (больше 3000 текстовых узлов), `doc_too_large` (JSON больше 128 КБ),
          `href_required`, `href_unexpected`, `href_invalid` (не `https://`, нет хоста, есть
          `userinfo` или пробел, длиннее 2048);
        - `too_long` (`details.field = content_doc`) — сериализованный текст длиннее 8000 знаков;
        - `media_not_found` (`details.field = media_file_ids`) — файла нет, он удалён или чужой,
          идентификатор в `details.media_file_id`;
        - `duplicate_media` (`details.field = media_file_ids`) — файл повторяется в альбоме;
        - `too_many_media` (`details.field = media_file_ids`) — изображений больше `MEDIA_ALBUM_LIMIT`
          (от 1 до 10).

        Кампания в `archived` — `409 conflict` с `details.reason = campaign_archived`.

        Длина считается в кодовых единицах UTF-16 сериализованного текста вместе с разметкой.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostDraftInput' }
            example:
              content_doc:
                type: doc
                content:
                  - type: heading
                    content: [{ type: text, text: Осенняя распродажа }]
                  - type: paragraph
                    content:
                      - { type: text, text: 'Скидки до 50% — ' }
                      - type: text
                        text: только неделю
                        marks: [{ type: bold }]
                      - { type: text, text: '. Подробности: https://shop.example.test/sale' }
              media_file_ids: ['0190a000-0000-7000-8000-000000000401']
              token_carrier: media
              token_position: below
      responses:
        '200':
          description: Черновик
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostDraft' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /campaigns/{id}/post/preview:
    post:
      tags: [campaigns]
      operationId: previewCampaignPost
      summary: Предпросмотр поста (S-05)
      description: |
        Сериализует сохранённый черновик в формат MAX и собирает пример итогового текста
        со строкой маркировки; erid в примере условный. Возвращает нарушения автоматических проверок.

        UTM-метки (A-21) в предпросмотре содержат заглушку номера заказа `order_0000000000`
        фиксированной ширины, поэтому длина не занижается. `media_urls` — подписанные ссылки
        со сроком действия; пока изображения с плашкой или их копии строятся, ссылок на них нет
        и в `problems` есть `media_processing` — предпросмотр нужно запросить ещё раз.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Предпросмотр
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostPreview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /campaigns/{id}/checkout:
    post:
      tags: [campaigns]
      operationId: checkoutCampaign
      summary: Оплатить кампанию (S-06, P-01)
      description: |
        Оформляет заказ из всех позиций корзины: создаёт версию поста 1 в `pending_moderation`,
        заказ в `moderation` и по размещению в `created` на каждую позицию; удерживает деньги
        с баланса; очищает корзину; кампания переходит в `ordered`.
        Отказ — `409` с кодом:
        - `campaign_incomplete` — кампания не готова к оплате; `details.missing_fields` — незаполненные или
          недопустимые поля (`date_from`, `date_to`, `time_from`, `time_to`; `date_to` — и когда до конца
          окна осталось не больше `PLACEMENT_WINDOW_GUARD`, 1 ч), `details.post_problems` — коды
          проблем поста из предпросмотра;
        - `cart_changed` — корзина пуста, канал недоступен, формат выключен или цена изменилась;
          `details.items` — идентификаторы позиций;
        - `insufficient_balance` — `details.missing_amount` — недостающая сумма в копейках;
        - `conflict` с `details.reason = campaign_not_draft` — кампания не в `draft`.
        Проверки идут по порядку: поля кампании, корзина, пост. Поэтому `missing_fields` и
        `post_problems` в одном ответе не встречаются, а `cart_changed` приходит раньше проблем поста.
        Повтор с тем же `Idempotency-Key` возвращает созданный заказ.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Заказ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  # ---------------------------------------------------------------- media
  /media:
    get:
      tags: [media]
      operationId: listMedia
      summary: Файлы медиатеки
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Файлы, новые сверху
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/MediaFile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      tags: [media]
      operationId: uploadMedia
      summary: Загрузить изображение
      description: |
        JPEG, PNG или WebP до 50 МБ; каждая сторона — от 160 до 7680 пикселей с учётом поворота EXIF.
        Тип определяется по содержимому, расширение имени не учитывается. Анимированные PNG и WebP
        не принимаются. Оригинал хранится без изменений и наружу не публикуется.
        Повторная загрузка того же файла (совпадает SHA-256) в организации возвращает существующую запись.

        Отказ — `422` с `details.field = file` и причиной в `details.reason`:
        `required` (нет части `file`), `empty`, `too_large`, `unsupported_type`, `animated`,
        `too_small`, `too_big_dimensions`, `malformed`. Тело больше предела тоже даёт `too_large`.
        Больше 60 загрузок в час на пользователя или больше 4 одновременных загрузок на сервер — `429`.

        Тестовый сервер проверяет только тип и размер, файл не хранит, размеры берёт условные.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Файл
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaFile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /media/{id}:
    delete:
      tags: [media]
      operationId: deleteMedia
      summary: Удалить файл
      description: |
        Мягкое удаление. Файл убирается из черновиков постов всех кампаний организации.
        Файл, использованный в версии поста, остаётся в ней.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204': { description: Удалён }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- orders
  /orders:
    get:
      tags: [orders]
      operationId: listOrders
      summary: Заказы рекламодателя
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/OrderStatus' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Заказы, новые сверху
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/OrderSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /orders/{id}:
    get:
      tags: [orders]
      operationId: getOrder
      summary: Заказ с размещениями
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Заказ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /orders/{id}/post-versions:
    post:
      tags: [orders]
      operationId: createOrderPostVersion
      summary: Отправить изменённый пост (S-29, P-11)
      description: |
        Создаёт следующую версию поста из текущего черновика кампании и отправляет её на модерацию.
        Размещения в `awaiting_blogger`, `awaiting_schedule`, `scheduled` возвращаются в `created` (P-11);
        опубликованные не меняются. Размещения, у которых до конца окна дат меньше 24 ч, отменяются
        (P-06, `window_elapsed`). Для размещений в `created` деньги удерживаются заново.
        Доступно, когда заказ в `rejected` или `in_progress`. Отказ — `409`:
        `details.reason = post_version_in_progress` — текущая версия на модерации или регистрации
        (заказ в `moderation` или `marking`); `nothing_to_update` — нет размещений до публикации
        (так же отвечают `completed` и `cancelled`); код `insufficient_balance` с
        `details.missing_amount`; код `campaign_incomplete` с `details.post_problems`.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Заказ с новой текущей версией
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /orders/{id}/cancel:
    post:
      tags: [orders]
      operationId: cancelOrder
      summary: Отменить заказ (S-07, P-06)
      description: |
        Отменяет размещения заказа в `created` и `awaiting_blogger` (P-06, `advertiser_cancel`);
        остальные не меняются. Удержания снимаются. Нечего отменять — `409` с
        `details.reason = nothing_to_cancel`.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Заказ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /orders/{id}/report:
    get:
      tags: [orders]
      operationId: getOrderReport
      summary: Отчёт по кампании (S-09)
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Отчёт
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /orders/{id}/report.csv:
    get:
      tags: [orders]
      operationId: getOrderReportCsv
      summary: Отчёт по кампании в CSV (S-09)
      description: |
        Те же строки и итог, что в `getOrderReport`, для Excel: UTF-8 с BOM, разделитель `;`,
        суммы в рублях с запятой (`11500,00`), время по Москве (`21.10.2026 10:00`). Последняя
        строка — итог. Имя файла — `order-{номер}-report.csv`.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: CSV
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /placements/{id}/cancel:
    post:
      tags: [orders]
      operationId: cancelPlacement
      summary: Отменить размещение (P-06)
      description: Допустимо из `created` и `awaiting_blogger`. Удержание снимается, деньги возвращаются на баланс.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Размещение
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdvertiserPlacement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
  /placements/{id}/accept:
    post:
      tags: [orders]
      operationId: acceptPlacement
      summary: Принять размещение (P-12)
      description: |
        Допустимо из `removed`. Удержание распределяется с полной долей, создаётся выплата блогеру —
        в одной транзакции. Повтор с тем же `Idempotency-Key` возвращает размещение без нового перехода.
        `409 invalid_transition`: не из `removed`; `details.reason = publication_live` — пост ещё в канале.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Размещение
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdvertiserPlacement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
  /placements/{id}/claims:
    post:
      tags: [orders]
      operationId: createPlacementClaim
      summary: Подать претензию (S-08, P-14)
      description: |
        Допустимо из `published` и из `removed` до `claim_deadline_at`. По размещению — одна претензия.
        Размещение переходит в `disputed`.
        Повтор с тем же `Idempotency-Key` возвращает размещение без новой претензии.
        `409 invalid_transition` с `details.reason = claim_window_closed` — окно претензий закрыто;
        `409 conflict` с `details.reason = claim_exists` — претензия уже подана; без `reason` — переход
        недопустим (например, спор уже открыт системой).
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimCreate' }
            example: { reason: removed_early, text: Пост удалён через 3 часа после публикации }
      responses:
        '201':
          description: Размещение
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdvertiserPlacement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  # ---------------------------------------------------------------- balance
  /balance:
    get:
      tags: [balance]
      operationId: getBalance
      summary: Баланс рекламодателя
      responses:
        '200':
          description: Баланс
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Balance' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /balance/transactions:
    get:
      tags: [balance]
      operationId: listBalanceTransactions
      summary: Движения по балансу
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Движения, новые сверху
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/BalanceTransaction' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /invoices:
    get:
      tags: [balance]
      operationId: listInvoices
      summary: Счета на пополнение
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Счета, новые сверху
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Invoice' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      tags: [balance]
      operationId: createInvoice
      summary: Выставить счёт на пополнение
      description: |
        Счёт действует 14 суток. Номер — `MX-` и шесть цифр; его нужно указать в назначении платежа.
        Не больше 10 счетов в час на пользователя и 30 на адрес. В тестовом сервере счёт можно
        «оплатить» через `POST /_mock/invoices/{id}/pay`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoiceCreate' }
            example: { amount: 5000000 }
      responses:
        '201':
          description: Счёт
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /invoices/{id}/check-payment:
    post:
      tags: [balance]
      operationId: checkInvoicePayment
      summary: Проверить поступление оплаты по своему счёту
      description: |
        Читает свежую выписку через общий импорт; сам запрос не подтверждает оплату.
        Общий лимит ручных опросов — раз в минуту на банковский счёт, между пользователями и экземплярами API.
        Фоновый checkpoint сохраняется. busy — повтор временно ограничен или выписка уже обрабатывается;
        Период чтения — от создания счёта (не раньше TBANK_IMPORT_FROM), максимум последние 31 сутки.
        unavailable — банк отключён, недоступен либо проверка не завершилась полностью.
        checked_at присутствует только после полного чтения свежего периода. Банковские операции других организаций не возвращаются.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Подтверждённое состояние счёта и результат проверки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoicePaymentCheck' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
  /invoices/{id}/pdf:
    get:
      tags: [balance]
      operationId: getInvoicePdf
      summary: Счёт в PDF
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /closing-acts:
    get:
      tags: [balance]
      operationId: listClosingActs
      summary: Закрывающие документы
      description: |
        Отчёт агента и акт на вознаграждение за месяц. Формируются 1-го числа за прошедший месяц
        для организаций, у которых в нём были распределены удержания.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Документы, новые сверху
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/ClosingAct' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /closing-acts/{id}/{document}:
    get:
      tags: [balance]
      operationId: getClosingActPdf
      summary: Отчёт агента или акт в PDF
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: document
          in: path
          required: true
          schema: { $ref: '#/components/schemas/ClosingDocument' }
      responses:
        '200':
          description: PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  # ---------------------------------------------------------------- blogger channels
  /blogger/channels:
    get:
      tags: [blogger-channels]
      operationId: listBloggerChannels
      summary: Каналы блогера
      responses:
        '200':
          description: Каналы
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/BloggerChannel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /blogger/channels/link-code:
    post:
      deprecated: true
      tags: [blogger-channels]
      operationId: createChannelLinkCode
      summary: Код подключения канала (S-12)
      description: |
        Устаревший сценарий для прежних клиентов. Новые клиенты используют
        `/blogger/channels/connections`: подключение через личный диалог без поста в канале.
        Блогер добавляет бота платформы в канал администратором с правами на публикацию
        и удаление сообщений, затем отправляет этот код сообщением в канал; бот связывает
        канал с организацией и удаляет сообщение (A-41). Код из 8 символов действует 60 минут,
        регистр и пробелы по краям не важны. Новый код гасит прежний код организации.
        Не больше `CHANNEL_LINK_CODES_PER_HOUR` (10) кодов организации в час — `429` с
        `details.scope = channel_link_code` и `Retry-After: 3600`.
        В тестовом сервере привязку выполняет `POST /_mock/channels/link`.
      responses:
        '201':
          description: Код
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelLinkCode' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /blogger/channels/connections:
    post:
      tags: [blogger-channels]
      operationId: createChannelConnection
      summary: Подключить канал по имени
      description: |
        Основной сценарий: передайте channel_name (название, @тег, ссылку MAX или ID).
        Сначала добавьте бота администратором канала с write/delete. Worker ищет среди
        известных боту каналов и проверяет только доступ и права бота, без проверки
        личности или прав пользователя MAX, затем привязывает канал к организации.
        Название сопоставляется целиком без учёта регистра, без нечёткого поиска.
        Совпадающие названия — failed/channel_name_ambiguous: укажите ссылку или ID.
        Нет известного канала — failed/channel_not_found. Чужая организация не меняется.
        201 означает созданную сессию, а не завершённую привязку: опрашивайте GET до
        connected/failed. Ни публикация, ни запуск бота в личном диалоге не требуются.
        Для совместимости POST без тела сохраняет прежний сценарий с одноразовым
        bot_url и проверкой личности MAX; с channel_name поле bot_url отсутствует.
        Сессия действует CHANNEL_LINK_CODE_TTL.
        Принимаются публичные и приватные каналы; публичная ссылка не требуется.
        Не больше CHANNEL_LINK_CODES_PER_HOUR сессий организации в час.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              required: [channel_name]
              properties:
                channel_name: { type: string, minLength: 1, maxLength: 512 }
            example: { channel_name: 'Рецепты на каждый день' }
      responses:
        '201':
          description: Сессия подключения
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ChannelConnection'
                  - type: object
                    properties:
                      bot_url: { type: string, format: uri }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /blogger/channels/connections/{id}:
    get:
      tags: [blogger-channels]
      operationId: getChannelConnection
      summary: Статус подключения и проверенные каналы
      description: |
        Доступно только пользователю, создавшему сессию, в той же организации.
        Для подключения по имени checking переходит в connected или failed; кандидаты
        и подтверждение claim не нужны. Проверяются права бота write/delete.
        В старом сценарии без channel_name кандидаты возвращаются только в ready:
        пользователь — владелец или администратор с write; бот имеет write/delete.
        checking и connecting — опрашивать до смены статуса.
        Пустой ready: добавьте бота, проверьте права и повторите refresh.
        failed/max_unavailable означает сбой MAX, а не отсутствие каналов.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Текущее состояние
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelConnection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /blogger/channels/connections/{id}/refresh:
    post:
      tags: [blogger-channels]
      operationId: refreshChannelConnection
      summary: Проверить доступные каналы в фоне
      description: |
        При channel_name повторяет поиск и подключение по сохранённому имени без
        запуска персональной ссылки. В старом сценарии требуется запуск bot_url.
        Проверяются каналы, обнаруженные
        из событий MAX; глобального списка каналов API MAX не предоставляет.
        Повтор во время checking не создаёт новую проверку. Между проверками — 10 секунд.
        При failed можно повторить refresh; при expired создайте новую сессию.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '202': { description: Проверка запущена }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /blogger/channels/connections/{id}/claim:
    post:
      tags: [blogger-channels]
      operationId: claimChannelConnection
      summary: Подтвердить выбранный канал
      description: |
        Принимает только кандидата этой сессии. Worker заново проверяет права
        пользователя и бота, затем атомарно привязывает канал. Следите за статусом
        сессии до connected или failed; 202 ещё не означает подключение.
        Повтор с тем же channel_id в connecting/connected идемпотентен.
        Чужая организация никогда не перезаписывается.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel_id]
              properties:
                channel_id: { type: string, format: uuid }
      responses:
        '202': { description: Подтверждение запущено }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /blogger/channels/{id}:
    get:
      tags: [blogger-channels]
      operationId: getBloggerChannel
      summary: Канал блогера
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Канал
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BloggerChannel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [blogger-channels]
      operationId: updateBloggerChannel
      summary: Описание, категория, номер РКН
      description: |
        Канал из `pending_rights` или `rejected` после правки уходит на модерацию, если права бота в порядке.
        Новый `rkn_number` сбрасывает проверку РКН в `pending`: канал `active` с подписчиками не меньше
        порога РКН уходит в `suspended` с `status_reason = rkn_required` до проверки администратором.
        Канал в `unclaimed`, `disconnected` или `blocked` не правится — `409` с `details.status`.
        Неизвестная или архивная категория — `422` с `details.field = category_id`,
        `details.reason = unknown category`.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BloggerChannelUpdate' }
            example:
              description: Рецепты на каждый день
              category_id: '0190a000-0000-7000-8000-000000000201'
      responses:
        '200':
          description: Канал
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BloggerChannel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /blogger/channels/{id}/prices:
    put:
      tags: [blogger-channels]
      operationId: setBloggerChannelPrices
      summary: Цены по форматам (S-13)
      description: |
        Цена блогера без комиссии, от 100 до 10 000 000 ₽. Передаётся полный набор форматов:
        формат, которого нет в наборе, удаляется. Цена для рекламодателя `total_amount` —
        `amount + floor(amount × комиссия / 10000)`.

        Канал в `unclaimed`, `disconnected` или `blocked` цены не принимает — `409`.
        `422` с `details.reason`: `duplicate_format` — формат повторяется; `unknown_format` —
        формата нет среди активных; `active_requires_price` — у канала в `active` должна
        остаться хотя бы одна включённая цена.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChannelPricesInput' }
            example:
              prices:
                - { format_id: f_1_24, amount: 300000, is_enabled: true }
                - { format_id: f_2_48, amount: 450000, is_enabled: true }
                - { format_id: f_3_72, amount: 600000, is_enabled: false }
      responses:
        '200':
          description: Канал
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BloggerChannel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /blogger/channels/{id}/unavailability:
    post:
      tags: [blogger-channels]
      operationId: addChannelUnavailability
      summary: Добавить интервал недоступности
      description: |
        Интервал, в который блогер не принимает публикации (S-13). Прошедшие интервалы в ответах
        не показываются. Канал в `unclaimed`, `disconnected` или `blocked` интервалы не принимает — `409`.
        `422` с `details.reason`: `in_past` — начало не раньше конца или конец уже прошёл;
        `too_long` — длиннее 90 суток; `too_far` — начало дальше 365 суток от текущего момента;
        `overlap` — пересекается с интервалом канала (соприкосновение границ — не пересечение);
        `too_many` — у канала уже 50 действующих интервалов; `placement_conflict`
        (`details.field = starts_at`) — пересекается с `[publish_at, remove_at)` размещения канала в `scheduled`.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UnavailabilityInput' }
            example: { starts_at: '2026-10-28T00:00:00Z', ends_at: '2026-10-30T00:00:00Z' }
      responses:
        '201':
          description: Канал
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BloggerChannel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /blogger/channels/{id}/unavailability/{unavailabilityId}:
    delete:
      tags: [blogger-channels]
      operationId: deleteChannelUnavailability
      summary: Удалить интервал недоступности
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: unavailabilityId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200':
          description: Канал
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BloggerChannel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- blogger placements
  /blogger/placements:
    get:
      tags: [blogger-placements]
      operationId: listBloggerPlacements
      summary: Запросы и размещения
      description: |
        Блогер видит размещения, хотя бы раз отправленные ему (P-02), в том числе вернувшиеся
        в `created` после новой версии поста (P-11). То же правило у `getBloggerPlacement`.
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/PlacementStatus' }
        - name: channel_id
          in: query
          schema: { $ref: '#/components/schemas/Uuid' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Размещения, новые сверху
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/BloggerPlacement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /blogger/placements/{id}:
    get:
      tags: [blogger-placements]
      operationId: getBloggerPlacement
      summary: Запрос на размещение
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Размещение с постом
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BloggerPlacement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /blogger/placements/{id}/accept:
    post:
      tags: [blogger-placements]
      operationId: bloggerAcceptPlacement
      summary: Принять в работу (P-03)
      description: |
        Из `awaiting_blogger` (иначе `409 invalid_transition`). Для блогера не юрлица нужен активный
        исполнитель Рокет Ворк (иначе `409 conflict` с `details.reason = contractor_inactive`). Канал
        должен быть `active` (иначе `409 conflict` с `details.reason = channel_not_active`).
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Размещение
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BloggerPlacement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
  /blogger/placements/{id}/decline:
    post:
      tags: [blogger-placements]
      operationId: bloggerDeclinePlacement
      summary: Отказаться (P-04)
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeclineInput' }
            example: { comment: Не подходит тематика }
      responses:
        '200':
          description: Размещение
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BloggerPlacement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
  /blogger/placements/{id}/schedule:
    post:
      tags: [blogger-placements]
      operationId: bloggerSchedulePlacement
      summary: Запланировать или опубликовать сейчас (P-17)
      description: |
        Из `awaiting_schedule`. `mode=at` — время `publish_at` внутри периода дат и времени суток кампании,
        не раньше чем через 1 ч, кратно 5 минутам и не в интервале недоступности; `mode=now` — текущий момент,
        если он внутри периода. `remove_at = publish_at + duration_hours`. Интервал топа
        `[publish_at, publish_at + top_hours)` не пересекается с топом других размещений канала (стык допустим).
        `422` с `details.reason`: `publish_at_required`, `outside_window`, `outside_time`, `too_soon`,
        `not_aligned`, `channel_unavailable_interval`, `slot_taken`. Канал не `active` — `409 conflict` с
        `details.reason = channel_not_active`; не из `awaiting_schedule` — `409 invalid_transition`.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleInput' }
            example: { mode: at, publish_at: '2026-10-21T09:00:00Z' }
      responses:
        '200':
          description: Размещение
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BloggerPlacement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /blogger/placements/{id}/reschedule:
    post:
      tags: [blogger-placements]
      operationId: bloggerReschedulePlacement
      summary: Перенести публикацию (P-07)
      description: |
        Из `scheduled`, если до прежнего `publish_at` больше 1 ч (иначе `409 invalid_transition`;
        для `scheduled` с `details.reason = too_late`).
        Новое время проверяется по тем же правилам, что `mode=at` планирования; причины `422` — те же.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RescheduleInput' }
            example: { publish_at: '2026-10-22T09:00:00Z' }
      responses:
        '200':
          description: Размещение
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BloggerPlacement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  # ---------------------------------------------------------------- blogger payouts
  /blogger/payouts:
    get:
      tags: [blogger-payouts]
      operationId: listBloggerPayouts
      summary: Выплаты блогеру
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Выплаты, новые сверху
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Payout' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /blogger/rocketwork:
    get:
      tags: [blogger-payouts]
      operationId: getRocketworkStatus
      summary: Состояние исполнителя в Рокет Ворк
      responses:
        '200':
          description: Состояние
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RocketworkStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /blogger/payouts/summary:
    get:
      tags: [blogger-payouts]
      operationId: getBloggerPayoutSummary
      summary: Итоги выплат блогеру (`blg/payouts`, «Итог»)
      responses:
        '200':
          description: Получено и в работе
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /blogger/rocketwork/invite:
    post:
      tags: [blogger-payouts]
      operationId: inviteRocketwork
      summary: Начать онбординг в Рокет Ворк (S-11)
      description: |
        Принимает запрос: задание проверяет исполнителя и при необходимости отправляет SMS-приглашение.
        Ссылка на регистрацию не гарантируется; интерфейс использует `next_action`. Повтор — то же состояние. Юрлицу
        Рокет Ворк не нужен — `409` с `details.reason = contractor_not_required`. Сервис не
        подключён — `503` с `details.reason = rocketwork_unavailable`. Не больше 10 запросов
        пользователя в час.
      responses:
        '202':
          description: Запрос принят, состояние исполнителя
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RocketworkStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Рокет Ворк не нужен (юрлицо)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error: { code: conflict, message: rocketwork is not required, details: { reason: contractor_not_required } }
                request_id: 0190a000-0000-7000-8000-00000000aaaa
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /blogger/rocketwork/refresh:
    post:
      tags: [blogger-payouts]
      operationId: refreshRocketworkStatus
      summary: Проверить статус исполнителя сейчас («Проверить статус»)
      description: |
        Ставит внеочередной опрос Рокет Ворк и возвращает текущее состояние; новое появится в
        `getRocketworkStatus` после опроса. Онбординг не начат — `status = none` без опроса.
        Не больше 10 запросов пользователя в час.
      responses:
        '200':
          description: Текущее состояние
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RocketworkStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Рокет Ворк не нужен (юрлицо)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /blogger/rocketwork/actions:
    post:
      tags: [blogger-payouts]
      operationId: requestRocketworkAction
      summary: Явное действие подключения исполнителя своей организации
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [invite, register, update, rebind] }
                first_name: { type: string, maxLength: 100 }
                last_name: { type: string, maxLength: 100 }
                second_name: { type: string, maxLength: 100 }
      responses:
        '202':
          description: Действие поставлено в очередь; повтор сохраняет контрольную точку
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RocketworkStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Действие недопустимо либо требует сверки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ---------------------------------------------------------------- admin: channels
  /admin/channels:
    get:
      tags: [admin-channels]
      operationId: listAdminChannels
      summary: Каналы для администратора (очередь модерации)
      description: |
        Роль: moderator, senior. Каналы всех организаций, кроме `unclaimed`, по времени последнего изменения, старые первыми.
        `rkn_recheck_due = true` — номер РКН подтверждён больше 90 суток назад и его пора проверить снова
        (06 §6.3); канал при этом продолжает работать.
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ChannelStatus' }
        - name: rkn_status
          in: query
          schema: { $ref: '#/components/schemas/RknStatus' }
        - name: rkn_recheck_due
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Каналы
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/AdminChannelListItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/channels/{id}:
    get:
      tags: [admin-channels]
      operationId: getAdminChannel
      summary: Канал для модерации (S-16 шаг 1)
      description: 'Роль: moderator, senior. Сведения из MAX, метрики за 30 суток, флаги аномалий, история модерации.'
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Канал
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminChannel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/channels/{id}/approve:
    post:
      tags: [admin-channels]
      operationId: approveChannel
      summary: Одобрить канал (S-16 шаг 3)
      description: |
        Роль: moderator, senior. Только из `moderation`. Нужны права бота, категория, включённая цена,
        а при подписчиках от 10 000 — подтверждённый номер РКН. Чего не хватает — `409` с
        `details.missing` из `rights`, `category`, `price`, `rkn`. Канал в другом состоянии — `409`
        с `details.status`.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Канал
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminChannel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/channels/{id}/reject:
    post:
      tags: [admin-channels]
      operationId: rejectChannel
      summary: Отклонить канал (S-16)
      description: |
        Роль: moderator, senior. Только из `moderation`. Канал переходит в `rejected`, текст причины виден блогеру в
        `status_reason`. После правки блогером канал снова уходит на модерацию.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChannelRejectInput' }
            example: { reason: В описании нет тематики канала }
      responses:
        '200':
          description: Канал
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminChannel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/channels/{id}/rkn-check:
    post:
      tags: [admin-channels]
      operationId: setChannelRknCheck
      summary: Результат проверки номера РКН (06 §6.3, Q-34)
      description: |
        Роль: moderator, senior. Администратор вручную сверил номер с реестром. Канал в `unclaimed` или `disconnected`
        либо без номера — `409` с `details.status`. `confirmed` возвращает в `active` канал,
        приостановленный с причиной `rkn_required`; `rejected` оставляет такой канал приостановленным,
        а канал `active` с подписчиками не меньше порога РКН переводит в `suspended` с `rkn_required`.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChannelRknCheckInput' }
            example: { result: confirmed }
      responses:
        '200':
          description: Канал
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminChannel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/channels/{id}/block:
    post:
      tags: [admin-channels]
      operationId: blockChannel
      summary: Заблокировать канал (S-19 `block_channel`)
      description: |
        Роль: senior. Из любого состояния, кроме `blocked`. Канал пропадает из каталога и корзины,
        новые размещения невозможны; уже идущие размещения продолжаются. Блогер видит
        `status_reason = blocked_by_admin`; основание пишется только в журнал действий.
        Повторная блокировка — `409` с `details.reason = already_blocked`.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminReasonInput' }
            example: { reason: Накрутка подписчиков подтверждена }
      responses:
        '200':
          description: Канал
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminChannel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/channels/{id}/unblock:
    post:
      tags: [admin-channels]
      operationId: unblockChannel
      summary: Снять блокировку канала
      description: |
        Роль: senior. Только из `blocked` (иначе `409` с `details.status`); канал уходит на повторную
        модерацию (`moderation`), а без прав бота — в `pending_rights` с
        `status_reason` `missing_rights`. Приватность канала не ограничивает допуск.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminReasonInput' }
            example: { reason: Блогер подтвердил живую аудиторию }
      responses:
        '200':
          description: Канал
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminChannel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  # ---------------------------------------------------------------- admin: dictionaries
  /admin/channel-categories:
    post:
      tags: [admin-dictionaries]
      operationId: createChannelCategory
      summary: Добавить категорию каналов
      description: |
        Роль: senior. `slug` — латиница, цифры и дефис, уникален; занят — `409` с `details.reason = slug_taken`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChannelCategoryInput' }
            example: { slug: pets, name: Животные, position: 120 }
      responses:
        '201':
          description: Категория
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminChannelCategory' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/channel-categories/{id}:
    patch:
      tags: [admin-dictionaries]
      operationId: updateChannelCategory
      summary: Изменить или убрать в архив категорию каналов
      description: |
        Роль: senior. Архивная категория не предлагается для новых каналов и не показывается в
        фильтре каталога; у каналов, где она уже выбрана, остаётся.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChannelCategoryUpdate' }
            example: { name: Домашние животные }
      responses:
        '200':
          description: Категория
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminChannelCategory' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  # ---------------------------------------------------------------- admin: orders (S-17)
  /admin/orders:
    get:
      tags: [admin-orders]
      operationId: listAdminOrders
      summary: Заказы для модерации поста (S-17 шаг 1)
      description: |
        Роль: moderator, senior. По умолчанию — `moderation`: сначала по началу периода публикации
        кампании, затем по времени ожидания; `urgent = true` — до начала периода меньше 6 часов или
        он уже начался (A-40). `marking` и `all` — по времени ожидания.
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [moderation, marking, all], default: moderation }
        - name: query
          in: query
          description: Номер заказа или ИНН рекламодателя целиком (точное совпадение)
          schema: { type: string, maxLength: 100 }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Заказы
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/AdminOrderListItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/orders/{id}:
    get:
      tags: [admin-orders]
      operationId: getAdminOrder
      summary: Заказ для модерации поста (S-17)
      description: |
        Роль: moderator, senior. Пост текущей версии в итоговом виде, каналы заказа, состояние креатива в ОРД.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Заказ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOrder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/orders/{id}/approve:
    post:
      tags: [admin-orders]
      operationId: approveOrderPost
      summary: Одобрить пост заказа (S-17 шаг 3)
      description: |
        Роль: moderator, senior. Только заказ в `moderation`: версия поста одобрена, заказ уходит в
        `marking`, креатив регистрируется в ОРД; после erid размещения переходят в `awaiting_blogger`.
        Иначе — `409 invalid_transition`.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Заказ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOrder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
  /admin/orders/{id}/reject:
    post:
      tags: [admin-orders]
      operationId: rejectOrderPost
      summary: Отклонить пост заказа (S-17 шаг 4)
      description: |
        Роль: moderator, senior. Только заказ в `moderation`: заказ `rejected`, удержания сняты,
        рекламодатель видит причину и может исправить пост (S-29).
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChannelRejectInput' }
            example: { reason: Нет сведений о продавце }
      responses:
        '200':
          description: Заказ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOrder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  # ---------------------------------------------------------------- admin: placements (S-19)
  /admin/placements:
    get:
      tags: [admin-placements]
      operationId: listAdminPlacements
      summary: Размещения всех организаций
      description: 'Роль: moderator, senior. Новые первыми.'
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/PlacementStatus' }
        - name: channel_id
          in: query
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: order_id
          in: query
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: from
          in: query
          description: Создано не раньше (дата по Москве)
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Создано не позже (дата по Москве, включительно)
          schema: { type: string, format: date }
        - name: removal_overdue
          in: query
          description: Только с просроченным снятием (пост жив после `remove_at` или снятие по сроку не удалось)
          schema: { type: boolean }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Размещения
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/AdminPlacementListItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/placements/{id}:
    get:
      tags: [admin-placements]
      operationId: getAdminPlacement
      summary: 'Размещение: история и ручные операции'
      description: |
        Роль: moderator, senior. `available_actions` учитывает и состояние, и роль: `cancel`,
        `mark_removed`, `retry_payout` есть только у `senior`.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 'Размещение'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPlacement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/placements/{id}/cancel:
    post:
      tags: [admin-placements]
      operationId: adminCancelPlacement
      summary: Отменить размещение (S-19 `admin_cancel`)
      description: |
        Роль: senior. P-06 из `created`, `awaiting_blogger`, `awaiting_schedule`, `scheduled`:
        размещение `cancelled`, удержание снято, стороны уведомлены. Иначе — `409 invalid_transition`.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminReasonInput' }
            example: { reason: 'Канал заблокирован, рекламодатель просит отменить' }
      responses:
        '200':
          description: 'Размещение'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPlacement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/placements/{id}/remove-post:
    post:
      tags: [admin-placements]
      operationId: adminRemovePost
      summary: Удалить пост (S-19 `admin_remove_post`)
      description: |
        Роль: moderator, senior. `published` или `disputed` с живой публикацией: бот удаляет пост
        сейчас; из `published` сначала открывается спор с причиной `admin`. Пост уже снят —
        `409` с `details.reason = publication_not_live`.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminReasonInput' }
            example: { reason: Пост нарушает правила площадки }
      responses:
        '200':
          description: 'Размещение'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPlacement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/placements/{id}/mark-removed:
    post:
      tags: [admin-placements]
      operationId: adminMarkRemoved
      summary: Отметить пост снятым (S-19 `admin_mark_removed`)
      description: |
        Роль: senior. Только `published`, когда бот не может удалить пост: публикация считается
        снятой в `removed_at` (между публикацией и «сейчас»), размещение `removed` (P-10), нарушение
        не записывается, срок претензии — от `removed_at`.

        Публикации нет, или она не жива и снятие не просрочено — `409 conflict` с
        `details.reason = publication_not_live`; недопустимый переход размещения — `409 invalid_transition`.
        `removed_at` раньше публикации или в будущем — `422` с `details.field = removed_at`,
        `details.reason = out_of_range`.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarkRemovedInput' }
            example: { removed_at: '2026-10-21T10:00:00Z', reason: Блогер удалил пост вручную по сроку }
      responses:
        '200':
          description: 'Размещение'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPlacement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/placements/{id}/open-dispute:
    post:
      tags: [admin-placements]
      operationId: adminOpenDispute
      summary: Открыть спор (S-19 `admin_open_dispute`)
      description: |
        Роль: moderator, senior. P-14 из `published` или `removed` с причиной `admin`; основание —
        в истории и журнале действий. Иначе — `409 invalid_transition`.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminReasonInput' }
            example: { reason: Жалоба рекламодателя по телефону }
      responses:
        '200':
          description: 'Размещение'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPlacement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  # ---------------------------------------------------------------- admin: disputes (S-18)
  /admin/disputes:
    get:
      tags: [admin-disputes]
      operationId: listAdminDisputes
      summary: Споры
      description: |
        Роль: moderator, senior. `open` — ближайший срок решения первым; `resolved` и `all` — новые первыми.
      parameters:
        - name: state
          in: query
          schema: { type: string, enum: [open, resolved, all], default: open }
        - name: overdue
          in: query
          description: Только открытые с прошедшим сроком T-06
          schema: { type: boolean }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Споры
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/AdminDisputeListItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/disputes/{id}:
    get:
      tags: [admin-disputes]
      operationId: getAdminDispute
      summary: Разбор спора (S-18 шаг 1)
      description: |
        Роль: moderator, senior. Причина, претензия с текстом, нарушения, публикация (план и факт),
        история, переписка, предпросмотр распределения по предложенной доле.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Спор
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminDispute' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/disputes/{id}/preview:
    get:
      tags: [admin-disputes]
      operationId: previewDisputeResolution
      summary: Как распределятся деньги при решении
      description: |
        Роль: moderator, senior. Ничего не меняет. `proportional` без `share` — по предложению системы;
        его нет — `422` с `details.reason = share_required`. `share` при `full_payout` или `full_refund`
        не передаётся, иначе `422` с `details.reason = out_of_range`. В обоих отказах
        `details.field = performance_share`.
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: resolution
          in: query
          required: true
          schema: { $ref: '#/components/schemas/DisputeResolution' }
        - name: share
          in: query
          description: Доля исполнения для `proportional`, 1…9999 (сотые доли процента)
          schema: { type: integer, minimum: 1, maximum: 9999 }
      responses:
        '200':
          description: Распределение
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DisputePreview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/disputes/{id}/resolve:
    post:
      tags: [admin-disputes]
      operationId: resolveDispute
      summary: Вынести решение (S-18 шаг 3, P-15)
      description: |
        Роль: moderator, senior. Решение окончательное: повтор — `409 conflict` с
        `details.reason = dispute_resolved`. `full_payout` или `proportional` (размещение станет
        `accepted`) при живой публикации — `409 invalid_transition` с `details.transition = P-15`
        и `details.reason = publication_live` (удалите пост или дождитесь снятия по сроку).
        `full_refund` при живой публикации удаляет пост сейчас. Правила `share` и поле
        `performance_share` в отказах — как у предпросмотра. Комментарий из одних пробелов — `422`
        с `details.field = comment`, `details.reason = length`.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DisputeResolutionInput' }
