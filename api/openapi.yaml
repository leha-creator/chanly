        actor_type: { type: string, enum: [admin, system] }
        actor_user_id: { $ref: '#/components/schemas/Uuid' }
        result: { type: string, enum: [confirmed, rejected], description: Для `rkn_checked` }
        comment: { type: string, description: Причина отказа или комментарий проверки }
        created_at: { type: string, format: date-time }
    ChannelRejectInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    ChannelRknCheckInput:
      type: object
      required: [result]
      properties:
        result: { type: string, enum: [confirmed, rejected] }
        comment: { type: string, maxLength: 500 }


    # ------------------------------------------------ admin: common
    AdminReasonInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500, description: Основание; пишется в журнал действий }
    AmountReasonInput:
      type: object
      required: [amount, reason]
      properties:
        amount: { type: integer, format: int64, minimum: 1, maximum: 100000000000, description: Копейки }
        reason: { type: string, minLength: 1, maxLength: 500 }
    AdminUserRef:
      type: object
      required: [id, email]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        email: { type: string }
    AdminApprovalStatus:
      type: string
      enum: [pending, approved, rejected, expired]
    AdminApproval:
      type: object
      description: Запрос второго подтверждения ручной денежной операции (R-2)
      required: [id, kind, status, amount, summary, reason, requested_by, created_at, expires_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, enum: [ledger_manual, deposit_topup, payout_mark_paid] }
        status: { $ref: '#/components/schemas/AdminApprovalStatus' }
        amount: { $ref: '#/components/schemas/Money' }
        summary: { type: string, description: 'Что будет сделано, например «bank → platform_revenue»' }
        object_id:
          allOf: [{ $ref: '#/components/schemas/Uuid' }]
          description: Выплата для `payout_mark_paid`
        reason: { type: string }
        requested_by: { $ref: '#/components/schemas/AdminUserRef' }
        decided_by: { $ref: '#/components/schemas/AdminUserRef' }
        decision_reason: { type: string }
        result_id:
          allOf: [{ $ref: '#/components/schemas/Uuid' }]
          description: Проводка или выплата после исполнения
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        decided_at: { type: string, format: date-time }
    AdminCounters:
      type: object
      description: |
        Счётчики меню. У `moderator` очереди только для `senior` (`bank_transactions_unmatched`,
        `payouts_failed`, `approvals_pending`) всегда 0.
      required: [channels_moderation, orders_moderation, disputes_open, disputes_overdue, ord_errors, bank_transactions_unmatched, payouts_failed, approvals_pending, ord_report_pending]
      properties:
        channels_moderation: { type: integer, minimum: 0 }
        orders_moderation: { type: integer, minimum: 0 }
        disputes_open: { type: integer, minimum: 0 }
        disputes_overdue: { type: integer, minimum: 0 }
        ord_errors: { type: integer, minimum: 0 }
        bank_transactions_unmatched: { type: integer, minimum: 0 }
        payouts_failed: { type: integer, minimum: 0 }
        approvals_pending: { type: integer, minimum: 0 }
        ord_report_pending:
          type: boolean
          description: Отчёт ОРД за прошлый месяц не отправлен целиком

    # ------------------------------------------------ admin: dictionaries
    AdminChannelCategory:
      allOf:
        - $ref: '#/components/schemas/ChannelCategory'
        - type: object
          required: [position, archived]
          properties:
            position: { type: integer, minimum: 0 }
            archived: { type: boolean }
    ChannelCategoryInput:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,49}$' }
        name: { type: string, minLength: 1, maxLength: 100 }
        position: { type: integer, minimum: 0, description: Нет — в конец списка }
    ChannelCategoryUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        position: { type: integer, minimum: 0 }
        archived: { type: boolean }

    # ------------------------------------------------ admin: orders
    AdminOrderListItem:
      type: object
      required: [id, number, status, advertiser, campaign_name, placements_count, total_amount, urgent, waiting_since, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        number: { type: integer, format: int64 }
        status: { $ref: '#/components/schemas/OrderStatus' }
        advertiser: { $ref: '#/components/schemas/AdminOrganizationRef' }
        campaign_name: { type: string }
        placements_count: { type: integer }
        total_amount: { $ref: '#/components/schemas/Money' }
        publish_from:
          type: string
          format: date-time
          description: Самое раннее начало окна публикации размещений заказа
        urgent:
          type: boolean
          description: Заказ в `moderation`, и до `publish_from` меньше 6 часов или оно прошло (A-40); в других состояниях — `false`
        waiting_since: { type: string, format: date-time, description: С какого момента заказ в текущем состоянии }
        created_at: { type: string, format: date-time }
    AdminOrder:
      allOf:
        - $ref: '#/components/schemas/AdminOrderListItem'
        - type: object
          required: [campaign_id, current_post_version, placements]
          properties:
            campaign_id: { $ref: '#/components/schemas/Uuid' }
            current_post_version: { $ref: '#/components/schemas/PostVersion' }
            links:
              type: array
              description: Ссылки поста (проверка на `https`, A-03)
              items: { type: string, format: uri }
            creative: { $ref: '#/components/schemas/OrdObject' }
            placements:
              type: array
              items: { $ref: '#/components/schemas/AdminPlacementListItem' }

    # ------------------------------------------------ admin: placements
    AdminPlacementAction:
      type: string
      enum: [cancel, remove_post, mark_removed, open_dispute, resolve_dispute, retry_payout]
    AdminPlacementListItem:
      allOf:
        - $ref: '#/components/schemas/PlacementTiming'
        - type: object
          required: [id, order_id, order_number, channel, advertiser, blogger, status, status_changed_at, total_amount, created_at]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            order_id: { $ref: '#/components/schemas/Uuid' }
            order_number: { type: integer, format: int64 }
            channel: { $ref: '#/components/schemas/ChannelRef' }
            advertiser: { $ref: '#/components/schemas/AdminOrganizationRef' }
            blogger: { $ref: '#/components/schemas/AdminOrganizationRef' }
            status: { $ref: '#/components/schemas/PlacementStatus' }
            status_reason: { type: string }
            status_changed_at: { type: string, format: date-time }
            total_amount: { $ref: '#/components/schemas/Money' }
            refund_amount: { $ref: '#/components/schemas/Money' }
            removal_overdue: { type: boolean, description: Пост жив после `remove_at` или снятие по сроку не удалось }
            created_at: { type: string, format: date-time }
    PlacementViolation:
      type: object
      required: [kind, occurred_at, source]
      properties:
        kind: { type: string, enum: [removed_early, content_modified, top_violated, bot_access_lost] }
        occurred_at: { type: string, format: date-time }
        source: { type: string, enum: [event, reconciliation] }
    AdminPlacement:
      allOf:
        - $ref: '#/components/schemas/AdminPlacementListItem'
        - type: object
          required: [blogger_amount, fee_amount, history, violations, payouts, available_actions]
          properties:
            blogger_amount: { $ref: '#/components/schemas/Money' }
            fee_amount: { $ref: '#/components/schemas/Money' }
            payout_amount: { $ref: '#/components/schemas/Money' }
            performance_share: { type: integer, minimum: 0, maximum: 10000 }
            publication_url: { type: string, format: uri }
            views: { type: integer }
            removal_reason: { type: string, enum: [schedule, external, admin, refund] }
            claim: { $ref: '#/components/schemas/PlacementClaim' }
            dispute: { $ref: '#/components/schemas/AdminDisputeBrief' }
            violations:
              type: array
              items: { $ref: '#/components/schemas/PlacementViolation' }
            history:
              type: array
              items: { $ref: '#/components/schemas/PlacementHistoryEntry' }
            payouts:
              type: array
              description: Попытки выплаты, последняя первой
              items: { $ref: '#/components/schemas/AdminPayout' }
            available_actions:
              type: array
              description: Действия, допустимые сейчас этому администратору (состояние и роль)
              items: { $ref: '#/components/schemas/AdminPlacementAction' }
    MarkRemovedInput:
      type: object
      required: [removed_at, reason]
      properties:
        removed_at: { type: string, format: date-time, description: Между публикацией и «сейчас» }
        reason: { type: string, minLength: 1, maxLength: 500 }

    # ------------------------------------------------ admin: disputes
    DisputeResolution:
      type: string
      enum: [full_payout, proportional, full_refund]
    AdminDisputeBrief:
      allOf:
        - $ref: '#/components/schemas/PlacementDisputeSummary'
        - type: object
          required: [id, overdue]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            overdue: { type: boolean, description: Открыт и срок T-06 прошёл }
            suggested_share:
              type: integer
              minimum: 0
              maximum: 10000
              description: Предложение системы для `proportional` (03 §7)
            performance_share: { type: integer, minimum: 0, maximum: 10000 }
            comment: { type: string, description: Основание решения (видит только администратор) }
            resolved_by: { $ref: '#/components/schemas/AdminUserRef' }
    AdminDisputeListItem:
      allOf:
        - $ref: '#/components/schemas/AdminDisputeBrief'
        - type: object
          required: [placement_id, order_number, channel, advertiser, blogger, placement_status, total_amount]
          properties:
            placement_id: { $ref: '#/components/schemas/Uuid' }
            order_number: { type: integer, format: int64 }
            channel: { $ref: '#/components/schemas/ChannelRef' }
            advertiser: { $ref: '#/components/schemas/AdminOrganizationRef' }
            blogger: { $ref: '#/components/schemas/AdminOrganizationRef' }
            placement_status: { $ref: '#/components/schemas/PlacementStatus' }
            total_amount: { $ref: '#/components/schemas/Money' }
    AdminDispute:
      allOf:
        - $ref: '#/components/schemas/AdminDisputeListItem'
        - type: object
          required: [placement, messages]
          properties:
            placement: { $ref: '#/components/schemas/AdminPlacement' }
            preview:
              allOf: [{ $ref: '#/components/schemas/DisputePreview' }]
              description: Распределение по предложенной доле; нет — предложения нет. Остаётся и у решённого спора
            messages:
              type: array
              items: { $ref: '#/components/schemas/DisputeMessage' }
    DisputePreview:
      type: object
      required: [resolution, share, total_amount, blogger_amount, fee_amount, refund_amount]
      properties:
        resolution: { $ref: '#/components/schemas/DisputeResolution' }
        share: { type: integer, minimum: 0, maximum: 10000, description: Доля исполнения }
        total_amount: { $ref: '#/components/schemas/Money' }
        blogger_amount: { $ref: '#/components/schemas/Money' }
        fee_amount: { $ref: '#/components/schemas/Money' }
        refund_amount: { $ref: '#/components/schemas/Money' }
    DisputeResolutionInput:
      type: object
      required: [resolution, comment]
      properties:
        resolution: { $ref: '#/components/schemas/DisputeResolution' }
        share:
          type: integer
          minimum: 1
          maximum: 9999
          description: Только для `proportional`; нет — предложение системы. При других решениях — `422 out_of_range`
        comment: { type: string, minLength: 1, maxLength: 2000 }
    DisputeMessage:
      type: object
      required: [id, author_type, text, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        author_type: { type: string, enum: [admin, advertiser, blogger] }
        recipient:
          type: string
          enum: [advertiser, blogger, both]
          description: Адресат сообщения администратора
        text: { type: string }
        created_at: { type: string, format: date-time }
    AdminDisputeMessageInput:
      type: object
      required: [to, text]
      properties:
        to: { type: string, enum: [advertiser, blogger, both] }
        text: { type: string, minLength: 1, maxLength: 2000 }
    DisputeMessageInput:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 2000 }

    # ------------------------------------------------ admin: payouts
    AdminPayout:
      allOf:
        - $ref: '#/components/schemas/Payout'
        - type: object
          required: [blogger]
          properties:
            blogger: { $ref: '#/components/schemas/AdminOrganizationRef' }
            bank_reference: { type: string, description: Платёжное поручение для `bank_transfer` }
    AdminPayoutStatusTotal:
      type: object
      required: [status, count, amount]
      properties:
        status: { $ref: '#/components/schemas/PayoutStatus' }
        count: { type: integer, minimum: 0 }
        amount: { $ref: '#/components/schemas/Money' }
    AdminPayoutSummary:
      type: object
      required: [by_status, deposit_ledger_amount, payable_amount, in_progress_amount, shortage_amount]
      properties:
        by_status:
          type: array
          description: Только состояния, в которых есть выплаты
          items: { $ref: '#/components/schemas/AdminPayoutStatusTotal' }
        deposit_ledger_amount:
          allOf: [{ $ref: '#/components/schemas/SignedMoney' }]
          description: Остаток депозита Рокет Ворк по журналу проводок
        payable_amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Начислено блогерам и не выплачено (`blogger_payable`)
        in_progress_amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Попытки `created` и `sent`
        shortage_amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: |
            Сколько не хватает депозита по журналу: начислено и не выплачено блогерам, которым платит
            Рокет Ворк (не `legal_entity`), плюс их доля по размещениям в `published` и `removed`,
            минус `deposit_ledger_amount`; 0 — хватает
    PayoutMarkPaidInput:
      type: object
      required: [bank_reference, reason]
      properties:
        bank_reference: { type: string, minLength: 1, maxLength: 200 }
        reason: { type: string, minLength: 1, maxLength: 500 }

    # ------------------------------------------------ admin: payments
    BankMatchStatus:
      type: string
      enum: [matched, unmatched, ignored]
    BankStatementSummary:
      type: object
      required: [id, account_number, incoming_count, matched_count, unmatched_count, duplicate_count, source, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        account_number: { type: string }
        date_from: { type: string, format: date }
        date_to: { type: string, format: date }
        opening_balance: { $ref: '#/components/schemas/SignedMoney' }
        closing_balance: { $ref: '#/components/schemas/SignedMoney' }
        incoming_count: { type: integer, minimum: 0 }
        matched_count: { type: integer, minimum: 0 }
        unmatched_count: { type: integer, minimum: 0 }
        duplicate_count: { type: integer, minimum: 0 }
        source: { type: string, enum: [file, tbank] }
        uploaded_by: { $ref: '#/components/schemas/AdminUserRef' }
        created_at: { type: string, format: date-time }
    BankTransaction:
      type: object
      required: [id, operation_date, amount, match_status, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        operation_date: { type: string, format: date }
        amount: { $ref: '#/components/schemas/Money' }
        payer_name: { type: string }
        payer_inn: { type: string }
        payer_account: { type: string }
        purpose: { type: string }
        match_status: { $ref: '#/components/schemas/BankMatchStatus' }
        organization: { $ref: '#/components/schemas/AdminOrganizationRef' }
        invoice_number: { type: string }
        matched_manually: { type: boolean }
        ignored_reason: { type: string }
        created_at: { type: string, format: date-time }
    BankTransactionMatchInput:
      type: object
      required: [organization_id, reason]
      properties:
        organization_id: { $ref: '#/components/schemas/Uuid' }
        invoice_id: { $ref: '#/components/schemas/Uuid' }
        reason: { type: string, minLength: 1, maxLength: 500 }
    AdminInvoice:
      allOf:
        - $ref: '#/components/schemas/Invoice'
        - type: object
          required: [organization]
          properties:
            organization: { $ref: '#/components/schemas/AdminOrganizationRef' }
            cancel_reason: { type: string }

    # ------------------------------------------------ admin: ledger
    LedgerAccountKind:
      type: string
      enum: [bank, rocketwork_deposit, payout_fees, diagnostic_expense, advertiser_balance, placement_hold, blogger_payable, platform_revenue]
    LedgerTransactionKind:
      type: string
      enum: [deposit, hold, hold_release, settlement, payout, deposit_topup, balance_return, manual, rw_diagnostic]
    LedgerAccountRef:
      type: object
      required: [kind]
      properties:
        kind: { $ref: '#/components/schemas/LedgerAccountKind' }
        organization_id:
          allOf: [{ $ref: '#/components/schemas/Uuid' }]
          description: Для `advertiser_balance` и `blogger_payable`
        placement_id:
          allOf: [{ $ref: '#/components/schemas/Uuid' }]
          description: Для `placement_hold`
    LedgerAccountTotal:
      type: object
      required: [kind, balance]
      properties:
        kind: { $ref: '#/components/schemas/LedgerAccountKind' }
        balance: { $ref: '#/components/schemas/SignedMoney' }
    LedgerSummary:
      type: object
      required: [accounts, balanced, advertiser_liabilities, bank_ledger_amount]
      properties:
        accounts:
          type: array
          description: Остаток по каждому виду счетов
          items: { $ref: '#/components/schemas/LedgerAccountTotal' }
        balanced: { type: boolean, description: Сумма остатков активов равна сумме пассивов (06 §2.2) }
        advertiser_liabilities:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Балансы и удержания рекламодателей
        bank_ledger_amount:
          allOf: [{ $ref: '#/components/schemas/SignedMoney' }]
          description: Расчётный счёт по журналу
        bank_statement_amount:
          allOf: [{ $ref: '#/components/schemas/SignedMoney' }]
          description: |
            Исходящий остаток последней по периоду (`date_to`) выписки, а не последней загруженной;
            нет — выписок нет или в ней нет остатка
        bank_statement_date:
          type: string
          format: date
          description: Конец периода этой выписки; бывает и без `bank_statement_amount`
        bank_difference:
          allOf: [{ $ref: '#/components/schemas/SignedMoney' }]
          description: Выписка минус журнал
    LedgerEntry:
      type: object
      required: [id, kind, amount, debit, credit, actor_type, created_at]
      properties:
        id:
          allOf: [{ $ref: '#/components/schemas/Uuid' }]
          description: Идентификатор операции; повторяется у каждой её проводки
        kind: { $ref: '#/components/schemas/LedgerTransactionKind' }
        amount: { $ref: '#/components/schemas/Money' }
        debit: { $ref: '#/components/schemas/LedgerAccountRef' }
        credit: { $ref: '#/components/schemas/LedgerAccountRef' }
        actor_type: { type: string, enum: [system, admin, advertiser] }
        actor_user_id: { $ref: '#/components/schemas/Uuid' }
        approver_user_id: { $ref: '#/components/schemas/Uuid' }
        reason: { type: string }
        placement_id: { $ref: '#/components/schemas/Uuid' }
        invoice_id: { $ref: '#/components/schemas/Uuid' }
        payout_id: { $ref: '#/components/schemas/Uuid' }
        created_at: { type: string, format: date-time }
    ManualLedgerInput:
      type: object
      required: [debit, credit, amount, reason]
      properties:
        debit: { $ref: '#/components/schemas/LedgerAccountRef' }
        credit: { $ref: '#/components/schemas/LedgerAccountRef' }
        amount: { type: integer, format: int64, minimum: 1, maximum: 100000000000 }
        reason: { type: string, minLength: 1, maxLength: 500 }
    LedgerOperationResult:
      type: object
      required: [transaction_id, replayed]
      properties:
        transaction_id: { $ref: '#/components/schemas/Uuid' }
        replayed: { type: boolean, description: Повтор с тем же ключом — проводка уже была }

    # ------------------------------------------------ admin: organizations
    AdminOrganizationListItem:
      type: object
      required: [id, name, inn, legal_type, status, cabinets, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        inn: { type: string, description: 'Полный у `senior`, с маской у `moderator`' }
        legal_type: { $ref: '#/components/schemas/LegalType' }
        status: { type: string, enum: [active, blocked] }
        cabinets:
          type: array
          items: { $ref: '#/components/schemas/Cabinet' }
        created_at: { type: string, format: date-time }
    AdminUser:
      type: object
      required: [id, email, status, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        email: { type: string, description: 'Полная у `senior`, с маской у `moderator`' }
        status: { type: string, enum: [active, blocked] }
        admin_role: { $ref: '#/components/schemas/AdminRole' }
        blocked_reason: { type: string }
        blocked_at: { type: string, format: date-time }
        last_login_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    AdminOrganization:
      allOf:
        - $ref: '#/components/schemas/AdminOrganizationListItem'
        - type: object
          required: [members, tax_document_uploaded]
          properties:
            kpp: { type: string }
            contact_name: { type: string }
            phone: { type: string, description: 'Полный у `senior`, с маской у `moderator`' }
            address: { type: string }
            tax_regime: { $ref: '#/components/schemas/TaxRegime' }
            vat_rate: { $ref: '#/components/schemas/VatRate' }
            tax_document_uploaded: { type: boolean }
            members:
              type: array
              items: { $ref: '#/components/schemas/AdminUser' }
            ord_counterparty: { $ref: '#/components/schemas/OrdObject' }
    AdminOrganizationUpdate:
      type: object
      required: [reason]
      properties:
        name: { type: string, minLength: 1, maxLength: 500 }
        kpp:
          type: string
          pattern: '^[0-9]{9}$'
          description: Только у `legal_entity` с кабинетом блогера; иначе `422 not_allowed`
        reason: { type: string, minLength: 1, maxLength: 500 }

    # ------------------------------------------------ admin: audit log
    AuditLogEntry:
      type: object
      required: [id, actor_type, action, object_type, object_id, data, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        actor_type: { type: string, enum: [advertiser, blogger, admin, system] }
        actor: { $ref: '#/components/schemas/AdminUserRef' }
        organization_id: { $ref: '#/components/schemas/Uuid' }
        action: { type: string, example: dispute.resolved }
        object_type: { type: string, example: dispute }
        object_id: { type: string }
        reason: { type: string }
        data:
          type: object
          additionalProperties: true
        created_at: { type: string, format: date-time }

    # ------------------------------------------------ admin: ORD
    OrdObjectType:
      type: string
      enum: [organization, contract, platform, creative, statistics, invoice, invoice_creatives]
    OrdSyncStatus:
      type: string
      enum: [pending, sent, synced, error]
    OrdObject:
      type: object
      required: [type, id, title, status, attempts, updated_at]
      properties:
        type: { $ref: '#/components/schemas/OrdObjectType' }
        id: { $ref: '#/components/schemas/Uuid' }
        title:
          type: string
          description: |
            Что это: в списке ошибок — `вид:идентификатор`, в карточке — подпись вида
            «Креатив версии <id>», «Статистика ГГГГ-ММ»
        external_id: { type: string }
        status: { $ref: '#/components/schemas/OrdSyncStatus' }
        ord_status: { type: string, description: Статус ответа ОРД }
        erid: { type: string, description: Для креатива; в списке ошибок не заполняется }
        error: { type: string }
        attempts: { type: integer, minimum: 0 }
        updated_at: { type: string, format: date-time }
        last_request: { $ref: '#/components/schemas/OrdRequestLog' }
        blocked:
          type: array
          description: Что ждёт этот объект (зависимые объекты). Бэкенд пока не заполняет
          items: { $ref: '#/components/schemas/OrdObjectRef' }
    OrdObjectRef:
      type: object
      required: [type, id]
      properties:
        type: { $ref: '#/components/schemas/OrdObjectType' }
        id: { $ref: '#/components/schemas/Uuid' }
    OrdRequestLog:
      type: object
      required: [id, operation, attempt, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        operation: { type: string }
        attempt: { type: integer }
        request:
          type: object
          additionalProperties: true
          description: Тело запроса, как сохранено (ИНН с маской, вместо текста — длина)
        response_status: { type: integer }
        response:
          type: object
          additionalProperties: true
        error: { type: string }
        created_at: { type: string, format: date-time }
    OrdReportState:
      type: string
      enum: [not_built, built, sending, sent, has_errors]
    OrdReportSummary:
      type: object
      required: [period, state, statistics_count, invoices_count, pending_count, error_count, due_date]
      properties:
        period: { type: string, pattern: '^\d{4}-\d{2}$', example: '2026-09' }
        state: { $ref: '#/components/schemas/OrdReportState' }
        statistics_count: { type: integer, minimum: 0 }
        invoices_count: { type: integer, minimum: 0 }
        pending_count: { type: integer, minimum: 0, description: Ждут отправки или подтверждения ОРД }
        error_count: { type: integer, minimum: 0 }
        impressions: { type: integer, format: int64, minimum: 0 }
        amount: { $ref: '#/components/schemas/Money' }
        built_at: { type: string, format: date-time }
        send_requested_at: { type: string, format: date-time }
        due_date:
          type: string
          format: date
          description: Срок сдачи — 30-е число следующего месяца (05 §3.7)
    OrdStatisticsRow:
      type: object
      required: [id, placement_id, creative_id, channel, impressions, amount, shown_from, shown_to, status, attempts]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        placement_id: { $ref: '#/components/schemas/Uuid' }
        creative_id: { $ref: '#/components/schemas/Uuid' }
        erid: { type: string }
        channel: { $ref: '#/components/schemas/ChannelRef' }
        impressions: { type: integer, format: int64, minimum: 0 }
        amount: { $ref: '#/components/schemas/Money' }
        shown_from: { type: string, format: date }
        shown_to: { type: string, format: date }
        status: { $ref: '#/components/schemas/OrdSyncStatus' }
        error: { type: string }
        attempts: { type: integer, minimum: 0 }
    OrdInvoiceRow:
      type: object
      required: [id, contract_kind, organization, number, invoice_date, amount, items_count, status, attempts, links_status, links_attempts]
      properties:
        links_status: { $ref: '#/components/schemas/OrdSyncStatus' }
        links_attempts: { type: integer, minimum: 0 }
        links_error: { type: string }
        document_request_id: { type: string }
        links_request_id: { type: string }
        reconciliation_required: { type: boolean }
        id: { $ref: '#/components/schemas/Uuid' }
        contract_kind: { type: string, enum: [initial, publisher] }
        organization: { $ref: '#/components/schemas/AdminOrganizationRef' }
        number: { type: string, example: MX-202609-1 }
        invoice_date: { type: string, format: date }
        amount: { $ref: '#/components/schemas/Money' }
        items_count: { type: integer, minimum: 0 }
        status: { $ref: '#/components/schemas/OrdSyncStatus' }
        error: { type: string }
        attempts: { type: integer, minimum: 0 }
    OrdReport:
      allOf:
        - $ref: '#/components/schemas/OrdReportSummary'
        - type: object
          required: [statistics, invoices]
          properties:
            statistics:
              type: array
              items: { $ref: '#/components/schemas/OrdStatisticsRow' }
            invoices:
              type: array
              items: { $ref: '#/components/schemas/OrdInvoiceRow' }

    # ------------------------------------------------ webhooks, mock
    WebhookPayload:
      type: object
      additionalProperties: true
    MockClock:
      type: object
      required: [now, offset_hours, transitions]
      properties:
        now: { type: string, format: date-time }
        offset_hours: { type: number, format: double }
        transitions:
          type: array
          description: Переходы, выполненные таймерами при сдвиге
          items: { $ref: '#/components/schemas/MockTransition' }
    MockTransition:
      type: object
      required: [placement_id, transition, to_status]
      properties:
        placement_id: { $ref: '#/components/schemas/Uuid' }
        transition: { type: string }
        to_status: { $ref: '#/components/schemas/PlacementStatus' }
    MockClockShift:
      type: object
      required: [hours]
      properties:
        hours: { type: number, format: double, minimum: 0, maximum: 2000 }
    MockRejectInput:
      type: object
      properties:
        reason: { type: string, maxLength: 1000 }
    MockAdvanceInput:
      type: object
      required: [transition]
      properties:
        transition: { type: string, enum: [P-08, P-10, P-16] }
    MockLinkChannelInput:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: '^[2-9A-HJ-NP-Z]{8}$', example: K7M2Q9XA }
        title: { type: string, maxLength: 200 }
        subscribers_count: { type: integer, minimum: 0, maximum: 100000000 }
