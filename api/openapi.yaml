        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Выплаты
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/AdminPayout' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/payouts/summary:
    get:
      tags: [admin-payouts]
      operationId: getAdminPayoutSummary
      summary: Сводка выплат и депозита Рокет Ворк
      description: |
        Роль: senior. Числа журнала проводок и таблицы выплат; остаток депозита по данным Рокет Ворк
        и расхождение — в сверке (`maxim admin money reconcile`, задание `check_rocketwork_deposit`).
      responses:
        '200':
          description: Сводка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPayoutSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/payouts/export:
    get:
      tags: [admin-payouts]
      operationId: exportAdminPayouts
      summary: Реестр выплат в CSV
      description: |
        Роль: senior. Те же фильтры, что у списка, без постраничности (до 10 000 строк). UTF-8 с BOM,
        разделитель `;`, суммы в рублях с запятой, время по Москве (`ДД.ММ.ГГГГ ЧЧ:ММ`); ИНН маскирован.
        Строки сверх 10 000 отбрасываются молча. Выгрузка пишется в журнал действий.

        Колонки: Создана (МСК), Блогер, ИНН, Заказ, Канал, Попытка, Способ, Сумма ₽, Состояние,
        Код ошибки, Платёжное поручение, Завершена (МСК), Выплата, Размещение. Значения перечислений
        выводятся как в API; ячейка, начинающаяся с `=`, `+`, `-` или `@`, получает ведущий апостроф.
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/PayoutStatus' }
        - name: organization_id
          in: query
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: CSV
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/payouts/{id}/retry:
    post:
      tags: [admin-payouts]
      operationId: retryPayout
      summary: Повторить выплату (S-19 `retry_payout`)
      description: |
        Роль: senior. Только последняя попытка `failed` с `method = rocketwork` размещения в `accepted`:
        создаётся новая попытка. Иначе — `409` с `details.reason = not_retryable`.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminReasonInput' }
            example: { reason: Блогер восстановил статус самозанятого }
      responses:
        '200':
          description: Новая попытка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPayout' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/payouts/{id}/mark-paid:
    post:
      tags: [admin-payouts]
      operationId: markPayoutPaid
      summary: Выплата юрлицу выполнена переводом
      description: |
        Роль: senior. Только `bank_transfer`. Сумма больше порога второго подтверждения — ответ `202`
        с запросом подтверждения: выплата отмечается после подтверждения другим `senior`.

        Отказы: не `bank_transfer`, попытка `failed` или уже `succeeded` с другим `bank_reference` —
        `409` с `details.reason = invalid_state`; пустой после обрезки пробелов `Idempotency-Key` —
        `422` с `details.field = Idempotency-Key`, `details.reason = invalid`. Повтор для `succeeded`
        с тем же `bank_reference` — `200` без изменений.
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayoutMarkPaidInput' }
            example: { bank_reference: п/п 1024 от 21.10.2026, reason: Оплачено по реестру }
      responses:
        '200':
          description: Выплата
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPayout' }
        '202': { $ref: '#/components/responses/ApprovalRequired' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  # ---------------------------------------------------------------- admin: payments (S-30)
  /admin/bank-statements:
    post:
      tags: [admin-payments]
      operationId: uploadBankStatement
      summary: Загрузить выписку (S-30 шаг 1)
      description: |
        Роль: senior. Файл «1С:Предприятие» (UTF-8, cp866, windows-1251), до `STATEMENT_MAX_BYTES`
        (10 МБ); тип файла не проверяется. Повтор того же файла — `409` с
        `details.reason = statement_already_imported`.

        Отказы по файлу — `422` с `details.field = file` и `details.reason`: `required` — части `file`
        нет или она пуста; `invalid` — тело не разбирается как multipart; `too_large` — больше лимита;
        `format` — файл не разобран как выписка; `another_account` — выписка не по счёту платформы.

        Выписка сохраняется до зачисления строк: если зачисление прервалось ошибкой `500`, уже
        зачисленные строки остаются, а повторная загрузка того же файла вернёт `409`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Итог загрузки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankStatementSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/bank-statements/latest:
    get:
      tags: [admin-payments]
      operationId: getLatestBankStatement
      summary: Последняя загруженная выписка
      description: 'Роль: senior. Выписок нет — `404`.'
      responses:
        '200':
          description: Выписка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankStatementSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/bank-transactions:
    get:
      tags: [admin-payments]
