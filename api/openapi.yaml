  # ---------------------------------------------------------------- admin: payouts
  /admin/rocketwork-check:
    get:
      tags: [admin-payouts]
      operationId: getAdminRocketworkCheck
      summary: Условия и результат небольшой проверки RocketWork на dev
      description: 'Роль: senior. Только development. Не меняет состояние бизнес-выплаты. Без настроенного допуска available=false. GET не обращается к провайдеру.'
      responses:
        '200':
          description: Доступность проверки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RocketworkCheck' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [admin-payouts]
      operationId: startAdminRocketworkCheck
      summary: Подтвердить заранее разрешённую проверку RocketWork
      description: 'Роль: senior. Только development. Тело отсутствует: сумма, получатель и допуск установлены оператором. If-Match содержит run_id просмотренных условий; при смене прогона запрос отклоняется. Повтор возвращает тот же прогон, не создаёт новый платёж. После старта доверенный сервис продолжает шаги и сверку автоматически.'
      parameters:
        - name: If-Match
          in: header
          description: 'Обязателен для запуска; отсутствие проверяется после роли администратора.'
          schema: { type: string }
      responses:
        '200':
          description: Тот же прогон после подтверждения
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RocketworkCheck' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /admin/payouts:
    get:
      tags: [admin-payouts]
      operationId: listAdminPayouts
      summary: Реестр выплат блогерам
      description: 'Роль: senior. Новые первыми.'
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/PayoutStatus' }
        - name: organization_id
          in: query
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: from
          in: query
