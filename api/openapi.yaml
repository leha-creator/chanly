        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/bank-transactions/{id}/match:
    post:
      tags: [admin-payments]
      operationId: matchBankTransaction
      summary: Зачислить поступление организации (S-30 шаг 3)
      description: |
        Роль: senior. Из `unmatched` или `ignored`; `matched` — `409 conflict` с `details.status`.
        Сумма зачисляется на баланс, счёт (если указан) помечается `paid`.

        Отказы: организация или счёт не найдены — `404`; организация платформы — `422` с
        `details.field = organization`, `details.reason = platform`; счёт другой организации — `422`
        с `details.field = invoice`, `details.reason = another_organization`; счёт не в `issued` и не
        в `expired` — `409 conflict` с `details.status`.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BankTransactionMatchInput' }
            example: { organization_id: 0190a000-0000-7000-8000-000000000011, reason: Плательщик — директор рекламодателя }
      responses:
        '200':
          description: Поступление
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankTransaction' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/bank-transactions/{id}/ignore:
    post:
      tags: [admin-payments]
      operationId: ignoreBankTransaction
      summary: Пометить поступление посторонним
      description: 'Роль: senior. Только из `unmatched`.'
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminReasonInput' }
            example: { reason: 'Возврат поставщика, не оплата рекламы' }
      responses:
        '200':
          description: Поступление
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankTransaction' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
