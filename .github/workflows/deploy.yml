# Real backend: checks on PR; production release on every push/merge to master.
name: deploy
on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
permissions:
  contents: read
jobs:
  backend:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/backend.yml
    with:
      ref: ${{ github.sha }}
  ops:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/ops.yml
    with:
      ref: ${{ github.sha }}
  release:
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      environment: ${{ github.ref_name == 'master' && 'production' || 'dev' }}
      ref: ${{ github.sha }}
      automatic: true
    secrets: inherit
